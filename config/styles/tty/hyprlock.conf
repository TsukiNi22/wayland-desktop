# wayland-desktop style: Terminal / better-tty - hyprlock (lock screen, inspired by the tty POC); @DIR@ = folder of the style

general {
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    path = @DIR@/wallpaper.jpg
    color = rgb(191724)
    blur_passes = 0
    brightness = 0.35
}

label {
    monitor =
    text = $TIME
    font_size = 72
    font_family = JetBrains Mono
    color = rgb(e0def4)
    position = 140, 220
    halign = left
    valign = center
}

label {
    monitor =
    text = fedora login: tsukini
    font_size = 18
    font_family = JetBrains Mono
    color = rgb(c4a7e7)
    position = 140, 110
    halign = left
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 3
    rounding = 10
    outer_color = rgb(c4a7e7)
    inner_color = rgb(1f1d2e)
    font_color = rgb(e0def4)
    check_color = rgb(9ccfd8)
    fail_color = rgb(eb6f92)
    placeholder_text = <i>_</i>
    fade_on_empty = false
    position = 140, 20
    halign = left
    valign = center
}

label {
    monitor =
    text = cmd[update:2000] playerctl metadata --format '♪  {{ title }}  ·  {{ artist }}' 2> /dev/null
    font_size = 14
    font_family = JetBrains Mono
    color = rgb(908caa)
    position = 140, 60
    halign = left
    valign = bottom
}
