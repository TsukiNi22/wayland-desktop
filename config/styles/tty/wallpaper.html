<!doctype html>
<!-- wayland-desktop style: Terminal / better-tty - live wallpaper (wd-wallpaper): an ASCII 3D torus spinning with the
     music in a tmux pane, the rose-pine spectrum of cava, a big block clock, a dim glyph rain and CRT scanlines -->
<html>
<head>
<meta charset="utf-8">
<style>
    html { background: transparent; }
    body { margin: 0; height: 100vh; overflow: hidden; background: #191724; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    /* the lock: the shell of better-tty over the live page */
    #shell { position: fixed; inset: 0; z-index: 30; display: none; cursor: none; color: #e0def4;
        font-family: "JetBrains Mono", monospace; background: rgba(25, 23, 36, 0.62); overflow: hidden; }
    #shell::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0.5;
        background: repeating-linear-gradient(to bottom, rgba(0, 0, 0, 0.35) 0 1px, transparent 1px 3px); }
    #shell .fetch { position: absolute; display: flex; gap: 2em; }
    #shell .picture { border-radius: 12px; background: #1f1d2e; overflow: hidden; display: flex; align-items: center;
        justify-content: center; color: #c4a7e7; font-size: 4em; flex: none; }
    #shell .picture img { width: 100%; height: 100%; object-fit: cover; }
    #shell .facts div { white-space: pre; line-height: 1.25; }
    #shell .swatches { display: flex; gap: 6px; padding-top: 0.6em; }
    #shell .swatches span { width: 2em; height: 1em; border-radius: 3px; }
    #shell .board { position: absolute; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; }
    #shell .line { white-space: pre-wrap; word-break: break-all; line-height: 1.25; }
    #shell .caret { display: inline-block; width: 0.6em; height: 1.15em; vertical-align: text-bottom; background: #e0def4;
        animation: blink 1.06s steps(1) infinite; }
    #shell .status { position: absolute; left: 10px; right: 10px; bottom: 10px; height: 1.9em; border-radius: 8px;
        background: #1f1d2e; display: flex; align-items: center; justify-content: space-between; padding: 0 14px;
        font-size: 0.9em; color: #908caa; }
    #shell .glyph { position: absolute; top: -40px; color: #9ccfd8; opacity: 0.5; font-size: 18px;
        animation: fall linear infinite; }
    #shell .train { position: absolute; white-space: pre; animation: train 3.5s linear forwards; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes fall { to { transform: translateY(110vh); } }
    @keyframes train { from { left: 100%; } to { left: -110%; } }
</style>
</head>
<body>
<canvas id="rain"></canvas>
<canvas id="main"></canvas>
<canvas id="crt"></canvas>
<script src="../../common/wallpaper/wd.js"></script>
<script>
"use strict";

// the small radio of wd.js, fitted into this page (Super+Shift+M or wd-style radio hide: hidden)
wd.radioLook = { layout: "pane", panel: "rgba(25, 23, 36, 0.78)", border: "#6e6a86", base: "#191724", fg: "#e0def4",
    muted: "#908caa", accent: "#c4a7e7", onAccent: "#191724", font: '"JetBrains Mono", monospace', corner: 9,
    title: "radio.sh \u2500 mpv", place: () => ({ x: 3 * cw, y: 30 * ch, w: 51 * cw }) };

const C = {
    base: "#191724", surface: "#1f1d2e", overlay: "#26233a", muted: "#6e6a86", subtle: "#908caa", text: "#e0def4",
    love: "#eb6f92", gold: "#f6c177", rose: "#ebbcba", pine: "#31748f", foam: "#9ccfd8", iris: "#c4a7e7",
};
const FONT = 15;
const LUMINANCE = ".,-~:;=!*#$@";
const RAMP = [C.pine, C.pine, C.pine, C.foam, C.foam, C.iris, C.iris, C.iris, C.rose, C.rose, C.gold, C.gold];
const GLYPHS = "01#$%&*+=<>/\\|{}[]~^@abcdef0123456789";
const DIGITS = {
    "0": ["01110", "10001", "10011", "10101", "11001", "10001", "01110"],
    "1": ["00100", "01100", "00100", "00100", "00100", "00100", "01110"],
    "2": ["01110", "10001", "00001", "00010", "00100", "01000", "11111"],
    "3": ["11110", "00001", "00001", "01110", "00001", "00001", "11110"],
    "4": ["00010", "00110", "01010", "10010", "11111", "00010", "00010"],
    "5": ["11111", "10000", "11110", "00001", "00001", "10001", "01110"],
    "6": ["00110", "01000", "10000", "11110", "10001", "10001", "01110"],
    "7": ["11111", "00001", "00010", "00100", "01000", "01000", "01000"],
    "8": ["01110", "10001", "10001", "01110", "10001", "10001", "01110"],
    "9": ["01110", "10001", "10001", "01111", "00001", "00010", "01100"],
    ":": ["0", "0", "1", "0", "1", "0", "0"],
};

const rain = wd.canvas("rain");
const main = wd.canvas("main");
const crt = wd.canvas("crt");
const random = wd.rand(39);
const font = `${FONT}px "JetBrains Mono", monospace`;
let cw = 9;
let ch = 19;
let cols = 0;
let rows = 0;
let streams = [];
let spectrumFill = null;
let angleA = 1;
let angleB = 0.6;

// =========================
// Layout (also on resize)
// =========================
function layout() {
    main.font = font;
    cw = main.measureText("M").width;
    ch = Math.round(FONT * 1.28);
    cols = Math.floor(wd.width / cw);
    rows = Math.floor(wd.height / ch);
    streams = Array.from({ length: Math.floor(cols / 3) }, () => ({
        x: Math.floor(random() * cols), y: random() * rows, speed: 3 + random() * 9, bright: random() < 0.12,
    }));

    // scanlines and vignette, drawn once
    crt.clearRect(0, 0, wd.width, wd.height);
    crt.fillStyle = "rgba(0, 0, 0, 0.12)";
    for (let y = 0; y < wd.height; y += 3) {
        crt.fillRect(0, y, wd.width, 1);
    }
    const vignette = crt.createRadialGradient(wd.width / 2, wd.height / 2, wd.height * 0.3,
        wd.width / 2, wd.height / 2, wd.height * 1.0);
    vignette.addColorStop(0, "rgba(0, 0, 0, 0)");
    vignette.addColorStop(1, "rgba(0, 0, 0, 0.6)");
    crt.fillStyle = vignette;
    crt.fillRect(0, 0, wd.width, wd.height);

    rain.fillStyle = C.base;
    rain.fillRect(0, 0, wd.width, wd.height);

    const top = (rows - 4 - spectrumRows()) * ch;
    spectrumFill = main.createLinearGradient(0, (rows - 4) * ch, 0, top);
    spectrumFill.addColorStop(0, C.pine);
    spectrumFill.addColorStop(0.3, C.foam);
    spectrumFill.addColorStop(0.55, C.iris);
    spectrumFill.addColorStop(0.75, C.rose);
    spectrumFill.addColorStop(0.9, C.gold);
    spectrumFill.addColorStop(1, C.love);
}

function spectrumRows() {
    return Math.max(6, Math.floor(rows * 0.24));
}

// =========================
// Pieces
// =========================
function text(ctx, value, col, row, color) {
    ctx.fillStyle = color;
    ctx.fillText(value, col * cw, row * ch);
}

// a tmux pane: rounded box with its title
function pane(col, row, width, height, title) {
    main.fillStyle = "rgba(25, 23, 36, 0.78)";
    main.strokeStyle = C.muted;
    main.lineWidth = 1;
    main.beginPath();
    main.roundRect(col * cw + 0.5, row * ch + ch / 2 + 0.5, (width - 1) * cw, (height - 1) * ch, cw);
    main.fill();
    main.stroke();
    main.fillStyle = C.base;
    main.fillRect((col + 1.5) * cw, row * ch, (title.length + 2) * cw, ch);
    text(main, ` ${title} `, col + 2, row, C.iris);
}

function drawRain(dt) {
    rain.fillStyle = "rgba(25, 23, 36, 0.16)";
    rain.fillRect(0, 0, wd.width, wd.height);
    rain.font = font;
    rain.textBaseline = "top";
    for (const stream of streams) {
        stream.y += stream.speed * dt * (1 + wd.energy * 3);
        if (stream.y * ch > wd.height + 40) {
            stream.y = -random() * 12;
            stream.x = Math.floor(random() * cols);
        }
        rain.fillStyle = stream.bright ? "rgba(196, 167, 231, 0.45)" : "rgba(110, 106, 134, 0.32)";
        rain.fillText(GLYPHS[Math.floor(random() * GLYPHS.length)], stream.x * cw, Math.floor(stream.y) * ch);
    }
}

// donut.c, faster with the music, bigger on the kicks
function drawTorus(dt) {
    const height = Math.max(18, Math.floor(rows * 0.46));
    const width = Math.ceil(height * ch / cw) + 2;
    const left = Math.floor(cols * 0.68 - width / 2);
    const top = Math.floor(rows * 0.37 - height / 2);
    const output = new Int8Array(width * height).fill(-1);
    const depth = new Float32Array(width * height);
    const r1 = 1;
    const r2 = 2;
    const k2 = 5;
    const k1 = (height / 2) * k2 / (r1 + r2) * 0.74 * (1 + 0.08 * wd.beat);

    angleA += dt * (0.55 + wd.energy * 2.4);
    angleB += dt * (0.3 + wd.bass * 1.6);
    const cA = Math.cos(angleA);
    const sA = Math.sin(angleA);
    const cB = Math.cos(angleB);
    const sB = Math.sin(angleB);

    for (let theta = 0; theta < 6.283; theta += 0.09) {
        const ct = Math.cos(theta);
        const st = Math.sin(theta);

        for (let phi = 0; phi < 6.283; phi += 0.035) {
            const cp = Math.cos(phi);
            const sp = Math.sin(phi);
            const circleX = r2 + r1 * ct;
            const circleY = r1 * st;
            const x = circleX * (cB * cp + sA * sB * sp) - circleY * cA * sB;
            const y = circleX * (sB * cp - sA * cB * sp) + circleY * cA * cB;
            const z = k2 + cA * circleX * sp + circleY * sA;
            const ooz = 1 / z;
            const px = Math.floor(width / 2 + k1 * ooz * x * (ch / cw));
            const py = Math.floor(height / 2 - k1 * ooz * y);
            const light = cp * ct * sB - cA * ct * sp - sA * st + cB * (cA * st - ct * sA * sp);

            if (light > 0 && px >= 0 && px < width && py >= 0 && py < height) {
                const index = px + py * width;

                if (ooz > depth[index]) {
                    depth[index] = ooz;
                    output[index] = Math.min(11, Math.floor(light * 8));
                }
            }
        }
    }
    pane(left - 3, top - 1, width + 6, height + 2, "torus.c ─ 3d");
    // one string per level and row (spaces elsewhere), built in one pass: a few dozen texts instead of thousands
    for (let y = 0; y < height; y++) {
        const lines = [];

        for (let x = 0; x < width; x++) {
            const level = output[x + y * width];

            if (level >= 0) {
                (lines[level] ??= new Array(width).fill(" "))[x] = LUMINANCE[level];
            }
        }
        lines.forEach((line, level) => {
            if (line) {
                main.fillStyle = RAMP[level];
                main.fillText(line.join(""), left * cw, (top + y) * ch);
            }
        });
    }
}

function drawClock(t) {
    const now = new Date();

    // a still wallpaper keeps no clock (hyprlock draws its own)
    if (wd.still !== null) {
        text(main, `${wd.user}@${wd.host}`, 5, 13, C.foam);
        text(main, " ~ \u276f better-tty", 5 + wd.user.length + wd.host.length + 1, 13, C.iris);
        return;
    }
    const value = now.toTimeString().slice(0, 5);
    const colors = [C.iris, C.iris, C.rose, C.rose, C.gold, C.gold, C.love];
    const pixel = Math.round(ch * 0.9);
    let left = 5 * cw;

    // square pixels, like a big block font
    for (const digit of value) {
        const pattern = DIGITS[digit];

        for (let y = 0; y < 7; y++) {
            main.fillStyle = colors[y];
            for (let x = 0; x < pattern[y].length; x++) {
                if (pattern[y][x] === "1") {
                    main.fillRect(left + x * pixel, 3 * ch + y * pixel, pixel - 3, pixel - 3);
                }
            }
        }
        left += (pattern[0].length + 1) * pixel;
    }
    const date = now.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
    text(main, date.toLowerCase(), 5, 11, C.subtle);
    text(main, `${wd.user}@${wd.host}`, 5, 13, C.foam);
    text(main, " ~ ❯ ", 5 + wd.user.length + wd.host.length + 1, 13, C.iris);
    if (Math.floor(t * 1.6) % 2 === 0) {
        main.fillStyle = C.text;
        main.fillRect((5 + wd.user.length + wd.host.length + 6) * cw, 13 * ch + 2, cw, ch - 4);
    }
}

// neofetch-like pane: the system (given by wd-wallpaper) and the palette
function drawInfo() {
    const lines = [
        ["os", wd.info.os], ["kernel", wd.info.kernel], ["wm", "Hyprland"], ["shell", wd.info.shell],
        ["theme", "rose-pine · better-tty"], ["music", wd.energy > 0.02 ? "♪ playing" : "♪ idle"],
    ];
    const palette = [C.love, C.gold, C.rose, C.pine, C.foam, C.iris, C.text, C.muted];
    const top = 16;

    pane(3, top, 52, lines.length + 6, "neofetch");
    lines.forEach(([key, value], i) => {
        text(main, key.padEnd(8), 6, top + 2 + i, C.iris);
        text(main, value, 15, top + 2 + i, key === "music" && wd.energy > 0.02 ? C.gold : C.text);
    });
    palette.forEach((color, i) => {
        main.fillStyle = color;
        main.fillRect((6 + i * 4) * cw, (top + lines.length + 3) * ch + 2, cw * 3, ch - 4);
    });
}

// cava: blocks in rose-pine, peaks, a baseline and the frequency marks
function drawSpectrum(t) {
    const height = spectrumRows();
    const base = (rows - 4) * ch;
    const width = Math.floor((cols - 12) / wd.bars);
    const left = Math.floor((cols - width * wd.bars) / 2);

    pane(left - 2, rows - 5 - height, width * wd.bars + 4, height + 3, "cava ─ spectrum");
    main.fillStyle = spectrumFill;
    for (let i = 0; i < wd.bars; i++) {
        const idle = 0.03 + 0.025 * Math.sin(t * 2 + i * 0.45);
        const level = Math.max(idle, wd.levels[i]);
        const cells = Math.round(level * height * 8) / 8;

        main.fillRect((left + i * width) * cw, base - cells * ch, (width - 1) * cw, cells * ch);
    }
    // the gaps between the cells, like block characters
    main.fillStyle = C.base;
    for (let y = 1; y <= height; y++) {
        main.fillRect(left * cw, base - y * ch, width * wd.bars * cw, 2);
    }
    main.fillStyle = C.text;
    for (let i = 0; i < wd.bars; i++) {
        if (wd.peaks[i] > 0.04) {
            main.fillRect((left + i * width) * cw, base - wd.peaks[i] * height * ch - 3, (width - 1) * cw, 2);
        }
    }
    text(main, "60 Hz", left, rows - 3.6, C.muted);
    text(main, "16 kHz", left + width * wd.bars - 6, rows - 3.6, C.muted);
}

function draw(t, dt) {
    main.clearRect(0, 0, wd.width, wd.height);
    main.font = font;
    main.textBaseline = "top";
    drawRain(dt);
    drawClock(t);
    drawInfo();
    drawTorus(dt);
    drawSpectrum(t);
}

layout();
addEventListener("resize", layout);
// =========================
// Lock: the shell of better-tty (its fastfetch, a prompt: login, switch <profile>, help...) over the live page
// =========================
const shell = { lines: [], stage: "command", login: "", input: "", history: [], back: -1, confirm: "", rain: false,
    element: null };
const COMMANDS = ["help", "login", "switch", "profiles", "whoami", "fastfetch", "date", "uptime", "music", "clear",
    "history", "echo", "cowsay", "fortune", "sl", "matrix", "hack", "sudo", "exit", "39", "suspend", "reboot", "poweroff"];
const FORTUNES = ["There is no place like 127.0.0.1", "It works on my machine.", "sudo make me a sandwich",
    "A clean desk is a sign of a full trash bin.", "The cake is a lie.", "Real programmers count from 0.",
    "rm -rf / is not a backup strategy", "39 = san-kyu = thank you"];
const TRAIN = "      ====        ________                ___________\n  _D _|  |_______/        \\__I_I_____===__|_________|\n"
    + "   |(_)---  |   H\\________/ |   |        =|___ ___|\n   /     |  |   H  |  |     |   |         ||_| |_||\n"
    + "  |      |  |   H  |__--------------------| [___] |\n  | ________|___H__/__|_____/[][]~\\_______|       |\n"
    + "  |/ |   |-----------I_____I [][] []  D   |=======|_\n__/ =| o |=-~~\\  /~~\\  /~~\\  /~~\\ ____Y___________|__\n"
    + " |/-=|___|=    ||    ||    ||    |_____/~\\___/\n  \\_/      \\O=====O=====O=====O_/      \\_/";

function element(tag, className, text) {
    const node = document.createElement(tag);

    if (className) {
        node.className = className;
    }
    if (text !== undefined) {
        node.textContent = text;
    }
    return node;
}

function say(text, color) {
    for (const line of String(text).split("\n")) {
        shell.lines.push({ text: line, color: color || C.text });
    }
    shell.lines = shell.lines.slice(-200);
    paintShell();
}

function profileName(id) {
    const found = (wd.lock.info.profiles || []).find(p => p.id === id);

    return found ? found.name : id;
}

// the facts of fastfetch, like the shell of quickshell
function facts() {
    const i = wd.lock.info.facts || {};
    const gb = bytes => (bytes / 1073741824).toFixed(1) + " GiB";
    const list = [];
    const up = i.Uptime ? Math.floor(i.Uptime.uptime / 1000) : 0;

    if (i.OS) {
        list.push(["os", i.OS.prettyName]);
    }
    if (i.Host) {
        list.push(["host", i.Host.name]);
    }
    if (i.Kernel) {
        list.push(["kernel", i.Kernel.release]);
    }
    if (up) {
        list.push(["uptime", `${Math.floor(up / 86400)}d ${Math.floor(up % 86400 / 3600)}h ${Math.floor(up % 3600 / 60)}m`]);
    }
    if (i.Packages) {
        list.push(["packages", String(i.Packages.all)]);
    }
    list.push(["wm", "Hyprland"]);
    if (i.CPU) {
        list.push(["cpu", i.CPU.cpu]);
    }
    if (i.GPU && i.GPU.length) {
        list.push(["gpu", i.GPU.map(g => g.name).filter(n => n).join(" + ")]);
    }
    if (i.Memory) {
        list.push(["memory", `${gb(i.Memory.used)} / ${gb(i.Memory.total)}`]);
    }
    if (i.Disk && i.Disk.length) {
        list.push(["disk", `${gb(i.Disk[0].bytes.used)} / ${gb(i.Disk[0].bytes.total)}`]);
    }
    if (i.Battery && i.Battery.length) {
        list.push(["battery", `${Math.round(i.Battery[0].capacity)}%`]);
    }
    list.push(["profile", profileName(wd.lock.info.style || "tty")]);
    return list;
}

function prompt() {
    if (shell.stage === "password") {
        return `password for ${shell.login}: `;
    }
    return shell.stage === "busy" ? "" : "> ";
}

// the whole shell drawn again: the fastfetch block, the transcript and its prompt, the status line of tmux
function paintShell() {
    const root = shell.element;

    if (!root) {
        return;
    }
    const size = Math.max(14, Math.round(wd.height / 62));
    const column = wd.width * 0.07;
    const info = wd.lock.info;

    root.style.fontSize = `${size}px`;
    root.replaceChildren();
    const fetch = element("div", "fetch");
    const picture = element("div", "picture");
    const side = Math.round(wd.height * 0.3);

    Object.assign(fetch.style, { left: `${column}px`, top: `${wd.height * 0.08}px` });
    Object.assign(picture.style, { width: `${side}px`, height: `${side}px` });
    if (info.logo) {
        const image = element("img");

        image.src = info.logo;
        picture.append(image);
    } else {
        picture.textContent = "\u276f_";
    }
    const list = element("div", "facts");
    const title = element("div", "", `${info.user || wd.user}@${info.host || wd.host}`);

    Object.assign(title.style, { color: C.foam, fontWeight: "bold", fontSize: "1.2em" });
    list.append(title, Object.assign(element("div", "", "\u2500".repeat(28)), { style: `color: ${C.muted}` }));
    for (const [key, value] of facts()) {
        const row = element("div");

        row.append(Object.assign(element("span", "", key.padEnd(10)), { style: `color: ${C.iris}` }), element("span", "", value));
        list.append(row);
    }
    const swatches = element("div", "swatches");

    for (const color of [C.love, C.gold, C.rose, C.pine, C.foam, C.iris, C.text, C.muted]) {
        swatches.append(Object.assign(element("span"), { style: `background: ${color}` }));
    }
    list.append(swatches);
    fetch.append(picture, list);
    root.append(fetch);
    const top = wd.height * 0.08 + side + size * 2;
    const board = element("div", "board");

    Object.assign(board.style, { left: `${column}px`, top: `${top}px`, width: `${wd.width - 2 * column}px`,
        height: `${wd.height - top - size * 3.6}px` });
    for (const line of shell.lines.slice(-80)) {
        board.append(Object.assign(element("div", "line", line.text || " "), { style: `color: ${line.color}` }));
    }
    const line = element("div", "line");

    line.append(Object.assign(element("span", "", prompt()), { style: `color: ${shell.stage === "command" ? C.iris : C.text}` }));
    // the password is never shown, not even as dots (like a console)
    line.append(element("span", "", shell.stage === "password" ? "" : shell.input));
    if (shell.stage !== "busy") {
        line.append(element("span", "caret"));
    }
    board.append(line);
    root.append(board);
    const status = element("div", "status");
    const playing = wd.radio.playing && wd.radio.title ? `   \u266a ${wd.radio.title}` : "";
    const now = new Date();

    status.append(element("span", "", `[locked] ${info.user || wd.user}@${info.host || wd.host}${playing}`),
        Object.assign(element("span", "", `${now.toLocaleDateString("en-GB", { weekday: "short", day: "2-digit", month: "short" })}`
            + `  ${now.toTimeString().slice(0, 5)}`), { style: `color: ${C.gold}` }));
    root.append(status);
    if (shell.rain) {
        for (let i = 0; i < 48; i++) {
            const glyph = element("span", "glyph", "01\uff71\uff72\uff73\uff74\uff75#$%&*+=<>"[i % 16]);

            Object.assign(glyph.style, { left: `${(i * 37) % wd.width}px`, animationDuration: `${1.8 + (i * 97) % 2200 / 1000}s`,
                animationDelay: `${-(i * 0.37) % 2}s` });
            root.append(glyph);
        }
    }
    if (shell.train) {
        root.append(Object.assign(element("div", "train", TRAIN), { style: `top: ${wd.height * 0.45}px` }));
    }
}

function cowsay(text) {
    say(` ${"_".repeat(text.length + 2)}\n< ${text} >\n ${"-".repeat(text.length + 2)}\n        \\   ^__^\n`
        + "         \\  (oo)\\_______\n            (__)\\       )\\/\\\n                ||----w |\n                ||     ||");
}

function complete(text) {
    const words = text.split(" ");
    const pool = words.length > 1 && words[0] === "switch" ? (wd.lock.info.profiles || []).map(p => p.id) : COMMANDS;
    const last = words[words.length - 1];
    const found = pool.filter(w => w.startsWith(last));

    if (found.length === 1) {
        words[words.length - 1] = found[0];
        return words.join(" ") + (words.length === 1 && found[0] === "switch" ? " " : "");
    }
    if (found.length > 1) {
        say(found.join("  "), C.subtle);
    }
    return text;
}

function hack(step = 0) {
    const steps = ["[\u25a0\u25a1\u25a1\u25a1\u25a1] bypassing the firewall...", "[\u25a0\u25a0\u25a1\u25a1\u25a1] decrypting /etc/shadow...",
        "[\u25a0\u25a0\u25a0\u25a1\u25a1] downloading more RAM...", "[\u25a0\u25a0\u25a0\u25a0\u25a1] reversing the polarity...",
        "[\u25a0\u25a0\u25a0\u25a0\u25a0] ACCESS DENIED. just type login :)"];

    shell.stage = "busy";
    say(steps[step], step === steps.length - 1 ? C.love : C.foam);
    if (step + 1 < steps.length) {
        setTimeout(() => hack(step + 1), 420);
    } else {
        shell.stage = "command";
        paintShell();
    }
}

function run(text) {
    const words = text.trim().split(/\s+/).filter(w => w);
    const name = words[0] || "";
    const rest = words.slice(1).join(" ");
    const profiles = wd.lock.info.profiles || [];
    const user = wd.lock.info.user || wd.user;

    if (shell.confirm && name !== shell.confirm) {
        shell.confirm = "";
    }
    switch (name) {
    case "":
        break;
    case "help":
        say("login                 type your password to unlock\n"
            + "switch <profile>      change the style (Tab completes)\n"
            + "profiles              the styles you can switch to\n"
            + "whoami                you and the active profile\n"
            + "fastfetch \u00b7 date \u00b7 uptime \u00b7 music \u00b7 history \u00b7 clear\n"
            + "suspend \u00b7 reboot \u00b7 poweroff\n"
            + "and a few more: sudo, cowsay, fortune, sl, matrix, hack, 39, exit...", C.subtle);
        break;
    case "login":
        shell.login = user;
        shell.stage = "password";
        break;
    case "switch":
        if (!rest) {
            say("switch <profile>: " + profiles.map(p => p.id).join("  "), C.subtle);
        } else if (profiles.some(p => p.id === rest)) {
            wd.lockRun("switch", rest);
            wd.lock.info.style = rest;
            say(`profile \u2192 ${profileName(rest)}  (the lock stays until you log in)`, C.foam);
        } else {
            say(`switch: no profile '${rest}' (profiles lists them)`, C.love);
        }
        break;
    case "profiles":
    case "ls":
        for (const p of profiles) {
            const on = p.id === wd.lock.info.style;

            say(`${on ? "\u25cf" : " "} ${p.id.padEnd(14)} ${p.name}`, on ? C.iris : C.text);
        }
        break;
    case "whoami":
        say(`${user}  \u00b7  profile: ${profileName(wd.lock.info.style || "tty")}  \u00b7  locked since ${wd.lock.since}`);
        break;
    case "fastfetch":
    case "neofetch":
        for (const [key, value] of facts()) {
            say(`${key.padEnd(9)} ${value}`);
        }
        break;
    case "date":
        say(new Date().toString());
        break;
    case "uptime":
        say(`up ${(facts().find(f => f[0] === "uptime") || [])[1] || "?"}`);
        break;
    case "music":
    case "np":
        say(wd.radio.playing && wd.radio.title ? `\u266a ${wd.radio.title}` : "nothing playing",
            wd.radio.playing ? C.foam : C.subtle);
        break;
    case "clear":
        shell.lines = [];
        break;
    case "history":
        shell.history.forEach((h, i) => say(`${String(i + 1).padStart(4)}  ${h}`, C.subtle));
        break;
    case "echo":
        say(rest);
        break;
    case "cowsay":
        cowsay(rest || "moo");
        break;
    case "fortune":
        say(FORTUNES[Math.floor(Math.random() * FORTUNES.length)], C.gold);
        break;
    case "sl":
        shell.train = true;
        setTimeout(() => {
            shell.train = false;
            paintShell();
        }, 3500);
        break;
    case "matrix":
        shell.rain = !shell.rain;
        break;
    case "hack":
        hack();
        return;
    case "sudo":
        say(`${user} is not in the sudoers file. This incident will be reported.`, C.love);
        break;
    case "rm":
        say(rest.includes("-rf") ? "nice try." : "rm: the files are behind the lock", C.love);
        break;
    case "exit":
    case "logout":
    case "quit":
        say("there is no exit. type login.", C.gold);
        break;
    case "39":
        say("san-kyu! \u266a (/\u25d5\u30ee\u25d5)/", "#39c5bb");
        break;
    case "lock":
        say("already locked :)", C.subtle);
        break;
    case "suspend":
        wd.lockRun("suspend");
        break;
    case "reboot":
    case "poweroff":
        if (shell.confirm === name) {
            wd.lockRun(name);
        } else {
            shell.confirm = name;
            say(`${name}: type it again to confirm`, C.gold);
        }
        break;
    default:
        say(`${name}: command not found (help)`, C.love);
    }
    paintShell();
}

// a line typed (Enter): a command, or the password
function submit(text) {
    if (shell.stage === "password") {
        say(prompt(), C.muted);
        if (text) {
            shell.stage = "busy";
            wd.lockSubmit(text);
        } else {
            say("authentication failed: try again (login)", C.love);
            shell.stage = "command";
        }
    } else if (shell.stage === "command") {
        say("> " + text, C.iris);
        if (text.trim()) {
            shell.history.push(text.trim());
        }
        shell.back = -1;
        run(text);
    }
    paintShell();
}

wd.lockStart = lock => {
    if (!shell.element) {
        shell.element = element("div");
        shell.element.id = "shell";
        document.body.append(shell.element);
    }
    Object.assign(shell, { lines: [], stage: "command", input: "", back: -1, confirm: "", rain: false, train: false });
    shell.element.style.display = "block";
    say("locked. type help, or login to come back.", C.subtle);
};
wd.lockStop = () => {
    if (shell.element) {
        shell.element.style.display = "none";
        shell.element.replaceChildren();
    }
    shell.input = "";
};
wd.lockInfo = () => paintShell();
wd.lockResult = ok => {
    if (ok) {
        say(`welcome back, ${shell.login} \u266a`, C.foam);
        shell.stage = "busy";
    } else {
        say("authentication failed: try again (login)", C.love);
        shell.stage = "command";
    }
    paintShell();
};
// the canvas of the lock stays empty: the shell is made of elements
wd.lockDraw = () => {
    // the status line keeps its clock and the music
    if (shell.element && Math.floor(performance.now() / 1000) !== shell.second) {
        shell.second = Math.floor(performance.now() / 1000);
        const status = shell.element.querySelector(".status");

        if (status && shell.second % 10 === 0) {
            paintShell();
        }
    }
};
wd.lockKeys = event => {
    if (shell.stage === "busy") {
        return true;
    }
    if (event.key === "Enter") {
        const text = shell.input;

        shell.input = "";
        submit(text);
    } else if (event.key === "Tab" && shell.stage === "command") {
        shell.input = complete(shell.input);
    } else if ((event.key === "ArrowUp" || event.key === "ArrowDown") && shell.stage === "command" && shell.history.length) {
        shell.back = event.key === "ArrowUp" ? Math.min(shell.history.length - 1, shell.back + 1) : Math.max(-1, shell.back - 1);
        shell.input = shell.back < 0 ? "" : shell.history[shell.history.length - 1 - shell.back];
    } else if (event.ctrlKey && event.key === "l") {
        shell.lines = [];
    } else if (event.ctrlKey && event.key === "c") {
        say(prompt() + (shell.stage === "password" ? "" : shell.input) + "^C", C.muted);
        shell.input = "";
        shell.stage = "command";
    } else if (event.key === "Backspace") {
        shell.input = shell.input.slice(0, -1);
    } else if (event.key.length === 1 && !event.ctrlKey && !event.altKey && !event.metaKey) {
        shell.input += event.key;
    }
    paintShell();
    return true;
};

wd.run(draw);
</script>
