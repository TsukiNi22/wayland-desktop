# wayland-desktop style: Terminal / better-tty - mako notifications
font=JetBrains Mono 11
background-color=#1f1d2ef0
text-color=#e0def4
border-color=#c4a7e7
progress-color=over #c4a7e755
border-size=2
border-radius=10
padding=14,18
margin=10
outer-margin=0,4,42,0
width=380
max-visible=4
default-timeout=4500
icons=1
max-icon-size=40
format=<b>%s</b>\n%b
anchor=bottom-right
layer=overlay

[app-name=wd-style]
border-size=3
default-timeout=2500

[urgency=low]
border-color=#403d52

[urgency=high]
border-color=#eb6f92
default-timeout=0

[mode=do-not-disturb]
invisible=1
