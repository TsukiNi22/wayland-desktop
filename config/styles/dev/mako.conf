# wayland-desktop style: Dev / low level - mako notifications
font=JetBrains Mono 11
background-color=#0a1d12f0
text-color=#b8f5cf
border-color=#39ff88
progress-color=over #39ff8855
border-size=2
border-radius=6
padding=14,18
margin=10
outer-margin=6,4,0,0
width=380
max-visible=4
default-timeout=4500
icons=1
max-icon-size=40
format=<b>%s</b>\n%b
anchor=top-right
layer=overlay

[app-name=wd-style]
border-size=3
default-timeout=2500

[urgency=low]
border-color=#1c4a2e

[urgency=high]
border-color=#ff4f5e
default-timeout=0

[mode=do-not-disturb]
invisible=1
