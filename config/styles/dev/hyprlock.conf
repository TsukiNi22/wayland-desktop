# wayland-desktop style: Dev / low level - hyprlock (lock screen, inspired by the dev POC); @DIR@ = folder of the style

general {
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    path = @DIR@/wallpaper.jpg
    color = rgb(040705)
    blur_passes = 0
    brightness = 0.35
}

label {
    monitor =
    text = $TIME
    font_size = 72
    font_family = JetBrains Mono
    color = rgb(b8f5cf)
    position = -40%, 25%
    halign = left
    valign = center
}

label {
    monitor =
    text = passphrase>
    font_size = 18
    font_family = JetBrains Mono
    color = rgb(39ff88)
    position = -40%, 10%
    halign = left
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    rounding = 0
    outer_color = rgb(39ff88)
    inner_color = rgb(0a1d12)
    font_color = rgb(b8f5cf)
    check_color = rgb(4fd1ff)
    fail_color = rgb(ff4f5e)
    placeholder_text = <i>_</i>
    fade_on_empty = false
    position = -40%, -2%
    halign = left
    valign = center
}
