# wayland-desktop style: Miku - hyprlock (lock screen, inspired by the miku POC); @DIR@ = folder of the style

general {
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    path = @DIR@/wallpaper.jpg
    color = rgb(0b2b2c)
    blur_passes = 2
    brightness = 0.6
}

label {
    monitor =
    text = $TIME
    font_size = 120
    font_family = Adwaita Sans
    color = rgb(39c5bb)
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = Unlock to sing ♪ · 39
    font_size = 18
    font_family = Adwaita Sans
    color = rgb(39c5bb)
    position = 0, 40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 3
    rounding = -1
    outer_color = rgb(39c5bb)
    inner_color = rgb(0f3a3b)
    font_color = rgb(e9fffd)
    check_color = rgb(e12885)
    fail_color = rgb(e12885)
    placeholder_text = <i>Password</i>
    fade_on_empty = false
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:2000] playerctl metadata --format '♪  {{ title }}  ·  {{ artist }}' 2> /dev/null
    font_size = 14
    font_family = Adwaita Sans
    color = rgb(86b9b5)
    position = 0, 60
    halign = center
    valign = bottom
}
