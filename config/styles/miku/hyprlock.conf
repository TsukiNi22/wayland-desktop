# wayland-desktop style: Miku - hyprlock (lock screen, inspired by the miku POC); @DIR@ = folder of the style
# The session behind it (its windows, a little darker), the LCD of the 39.39 FM radio in the middle: the teal clock
# with a pink glow, the date, the password between teal and pink with leeks for dots; the sticky note of the POC on
# its corner, the notes around, the music at the bottom

general {
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    color = rgb(0b2b2c)
    blur_passes = 0
    brightness = 0.7
}

# the LCD
shape {
    monitor =
    size = 520, 380
    color = rgba(5, 27, 28, 0.82)
    rounding = 26
    border_size = 3
    border_color = rgba(57, 197, 187, 0.95) rgba(225, 40, 133, 0.95) 45deg
    shadow_passes = 2
    shadow_size = 12
    shadow_color = rgba(57, 197, 187, 0.35)
    position = 0, 0
    halign = center
    valign = center
}

label {
    monitor =
    text = <b>39.39 FM</b>   <span foreground="##e12885">●</span> LOCKED
    font_size = 13
    font_family = JetBrains Mono
    color = rgb(7ff5ea)
    position = -150, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = <b>$TIME</b>
    font_size = 88
    font_family = Adwaita Sans
    color = rgb(7ff5ea)
    shadow_passes = 3
    shadow_size = 6
    shadow_color = rgba(225, 40, 133, 0.75)
    position = 0, 75
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"♪  %A %-d %B  ♪"
    font_size = 16
    font_family = Adwaita Sans
    color = rgb(39c5bb)
    position = 0, 0
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 340, 54
    outline_thickness = 3
    rounding = -1
    outer_color = rgba(57, 197, 187, 1.0) rgba(225, 40, 133, 1.0) 90deg
    inner_color = rgba(15, 58, 59, 0.95)
    font_color = rgb(e9fffd)
    check_color = rgb(39c5bb)
    fail_color = rgb(e12885)
    fail_text = <i>try again ♪ ($ATTEMPTS)</i>
    placeholder_text = <span foreground="##86b9b5">Unlock to sing ♪</span>
    dots_text_format = 🥬
    dots_size = 0.4
    fade_on_empty = false
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = ♪    ♫    39    ♫    ♪
    font_size = 14
    font_family = Adwaita Sans
    color = rgba(225, 40, 133, 0.9)
    position = 0, -150
    halign = center
    valign = center
}

# the sticky note of the POC, on the corner of the LCD
shape {
    monitor =
    size = 230, 120
    color = rgba(255, 238, 140, 0.96)
    rounding = 4
    rotate = -5
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.45)
    position = 300, 170
    halign = center
    valign = center
}

label {
    monitor =
    text = <i>today's mood: ♪ ♪ ♪</i>
    font_size = 13
    font_family = Adwaita Sans
    color = rgb(4a3b1a)
    rotate = -5
    position = 296, 198
    halign = center
    valign = center
}

label {
    monitor =
    text = <span foreground="##e12885"><b>39</b></span> = san-kyu = thank you
    font_size = 13
    font_family = Adwaita Sans
    color = rgb(4a3b1a)
    rotate = -5
    position = 302, 166
    halign = center
    valign = center
}

label {
    monitor =
    text = ✨ (/◕ヮ◕)/ ♪
    font_size = 13
    font_family = Adwaita Sans
    color = rgb(4a3b1a)
    rotate = -5
    position = 306, 134
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:2000] t=$(playerctl metadata title 2> /dev/null) && echo "♪  $t  ·  $(playerctl metadata artist 2> /dev/null)"
    font_size = 14
    font_family = Noto Sans CJK JP
    color = rgb(7ff5ea)
    shadow_passes = 2
    shadow_color = rgba(0, 0, 0, 0.8)
    position = 0, 60
    halign = center
    valign = bottom
}
