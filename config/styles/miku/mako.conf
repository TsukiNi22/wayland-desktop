# wayland-desktop style: Miku - mako notifications
font=Adwaita Sans 11
background-color=#0f3a3bf0
text-color=#e9fffd
border-color=#39c5bb
progress-color=over #39c5bb55
border-size=2
border-radius=14
padding=14,18
margin=10
outer-margin=6,4,0,0
width=380
max-visible=4
default-timeout=4500
icons=1
max-icon-size=40
format=<b>%s</b>\n%b
anchor=top-right
layer=overlay

[app-name=wd-style]
border-size=3
default-timeout=2500

[urgency=low]
border-color=#1f6f6a

[urgency=high]
border-color=#ff4fa3
default-timeout=0

[mode=do-not-disturb]
invisible=1
