<!doctype html>
<!-- wayland-desktop style: Miku - live wallpaper (wd-wallpaper): Miku and her 39, a ring of spectrum turning around
     the 39, notes rising with the music, teal and pink twin-tail ribbons, a light sweeping the stripes, a retro radio
     to click (39.39 FM: famous Miku songs) and the sticky note of the POC: click it for the MIKU MIKU BEAM (Now
     Loading, the three lights of the count and its subtitles, then the beam of its official video, a personal copy
     cut once by wd-wallpaper) -->
<html>
<head>
<meta charset="utf-8">
<style>
    html { background: transparent; }
    body { margin: 0; height: 100vh; overflow: hidden; background: #0b2b2c; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<canvas id="main"></canvas>
<script src="../../common/wallpaper/wd.js"></script>
<script>
"use strict";

const TEAL = [57, 197, 187];
const PINK = [225, 40, 133];
const ctx = wd.canvas("main");
const art = wd.image("wallpaper.jpg");
const random = wd.rand(39);
const notes = [];
const NOTE_GLYPHS = ["♪", "♫", "♬", "♩"];
const MONO = '"JetBrains Mono", monospace';
const JP = '"Noto Sans CJK JP", "Adwaita Sans", sans-serif';
const radio = wd.player();
let u = 1;
let panel = { x: 0, y: 0, w: 0, h: 0 };

function layout() {
    u = Math.min(wd.width / 1920, wd.height / 1080);
    panel = { x: wd.width - 470 * u, y: 140 * u, w: 420 * u, h: 156 * u };
    note = { x: wd.width * 0.43, y: 120 * u, w: 250 * u, h: 112 * u };
    wd.clickable([panel, note]);
}

// =========================
// Sticky note, MIKU MIKU BEAM
// =========================
let note = { x: 0, y: 0, w: 0, h: 0 };
let beam = null;
let audio = null;
let lift = 0;

// the note of the POC; it is also the hidden button of the beam
function drawNote(dt) {
    const over = wd.hit(note) && !beam;

    lift += ((over ? 1 : 0) - lift) * (1 - Math.exp(-dt * 10));
    ctx.save();
    ctx.translate(note.x + note.w / 2, note.y + note.h / 2);
    ctx.rotate((4 - lift * 3) * Math.PI / 180);
    ctx.scale(1 + lift * 0.04, 1 + lift * 0.04);
    ctx.shadowColor = "rgba(0, 0, 0, 0.45)";
    ctx.shadowBlur = (14 + lift * 10) * u;
    ctx.shadowOffsetX = 4 * u;
    ctx.shadowOffsetY = (6 + lift * 6) * u;
    ctx.fillStyle = "#fff8b8";
    ctx.fillRect(-note.w / 2, -note.h / 2, note.w, note.h);
    ctx.shadowColor = "transparent";
    ctx.fillStyle = "rgba(225, 40, 133, 0.25)";
    ctx.fillRect(-note.w * 0.18, -note.h / 2 - 8 * u, note.w * 0.36, 16 * u);
    ctx.font = `${15 * u}px "Adwaita Sans", "Noto Color Emoji", sans-serif`;
    ctx.fillStyle = "#3b3a2a";
    const left = -note.w / 2 + 16 * u;

    ctx.fillText("today's mood: \ud83e\udd6c\ud83e\udd6c\ud83e\udd6c", left, -note.h / 2 + 30 * u);
    ctx.fillStyle = "#e12885";
    ctx.font = `bold ${15 * u}px "Adwaita Sans", sans-serif`;
    ctx.fillText("39", left, -note.h / 2 + 58 * u);
    ctx.fillStyle = "#3b3a2a";
    ctx.font = `${15 * u}px "Adwaita Sans", sans-serif`;
    ctx.fillText(" = san-kyu = thank you", left + ctx.measureText("39").width + 2 * u, -note.h / 2 + 58 * u);
    ctx.font = `${15 * u}px "Adwaita Sans", "Noto Color Emoji", "Noto Sans CJK JP", sans-serif`;
    ctx.fillText("\u2728 \u266a (/\u25d5\u30ee\u25d5)/*:\uff65\uff9f\u2727", left, -note.h / 2 + 86 * u);
    ctx.restore();
    wd.cursor(over || radio.rects.some(wd.hit));
}

// The beam of "M@GICAL☆CURE! LOVE ♥ SHOT!" (SAWTOWNE feat. Hatsune Miku): its part of the official video (radio.json
// "media", cut once by wd-wallpaper from 1:25.28 of the video, a personal copy) gives the sound and the clock; on that
// clock, before the video shows: its subtitles, the "Now Loading..." card, the three lights of the count with their
// flashes (on the voice: its accents measured in the sound, the cuts of the video come 0.2 s before "Two" and
// "Three"); from "Ready?" (its next cut) on, the video itself: MIKU MIKU BEAAAAM!!
const LINES = [[0, 2.15, "and now it's time..."], [2.2, 4.75, "for the moment you've been waiting for!"], [4.89, 6.2, "One!"],
    [6.23, 7.45, "Two!"], [7.48, 8.36, "Three——!!!"]];
const COUNT = [4.89, 6.23, 7.48];
const READY = 8.36;
const END = 19.3;
let beamVideo = null;
let analyser = null;

function fire() {
    if (beam) {
        return;
    }
    beamVideo = beamVideo || wd.video("beam", { audio: true });
    beam = { start: performance.now(), data: null };
    if (!beamVideo) {
        return;
    }
    try {
        if (!analyser) {
            audio = new AudioContext();
            analyser = audio.createAnalyser();
            analyser.fftSize = 512;
            audio.createMediaElementSource(beamVideo).connect(analyser).connect(audio.destination);
        }
        audio.resume();
        beam.data = new Uint8Array(analyser.fftSize);
    } catch (error) {
        beam.data = null;
    }
    beamVideo.currentTime = 0;
    beamVideo.play();
}

addEventListener("click", event => {
    if (event.clientX >= note.x && event.clientX <= note.x + note.w && event.clientY >= note.y && event.clientY <= note.y + note.h) {
        fire();
    }
});

// time of the video (or of the clock without it) and its loudness 0-1
function beamTime() {
    return beamVideo && !beamVideo.paused ? beamVideo.currentTime : (performance.now() - beam.start) / 1000;
}

function loudness() {
    if (!beam.data) {
        return 0.6 + 0.4 * Math.abs(Math.sin(performance.now() / 90));
    }
    analyser.getByteTimeDomainData(beam.data);
    let sum = 0;

    for (const v of beam.data) {
        sum += ((v - 128) / 128) ** 2;
    }
    return Math.min(1, Math.sqrt(sum / beam.data.length) * 3.5);
}

function bigText(text, x, y, size, pop, angle = -0.06) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.scale(pop, pop);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = `italic 900 ${size}px "Adwaita Sans", sans-serif`;
    for (let i = 7; i > 0; i--) {
        ctx.fillStyle = i > 4 ? "#062627" : "#0d4f4c";
        ctx.fillText(text, i * size * 0.012, i * size * 0.012);
    }
    ctx.lineWidth = size * 0.09;
    ctx.lineJoin = "round";
    ctx.strokeStyle = "#ffffff";
    ctx.strokeText(text, 0, 0);
    const fill = ctx.createLinearGradient(0, -size / 2, 0, size / 2);

    fill.addColorStop(0, `rgb(${TEAL.join(", ")})`);
    fill.addColorStop(0.55, "#e9fffd");
    fill.addColorStop(1, `rgb(${PINK.join(", ")})`);
    ctx.fillStyle = fill;
    ctx.fillText(text, 0, 0);
    ctx.restore();
}

// an elastic pop: 0 -> 1 with a small overshoot
function popIn(k) {
    return k <= 0 ? 0 : (k >= 1 ? 1 : 1 + Math.pow(2, -10 * k) * Math.sin((k * 10 - 0.75) * (2 * Math.PI / 3)));
}

const LOADING = [[255, 170, 90], [255, 120, 170], [190, 235, 80], [90, 225, 235], [200, 130, 245], [255, 225, 90]];
const LIGHTS = [[230, 40, 70], [255, 200, 40], [110, 210, 60]];

function ease(k) {
    const x = Math.max(0, Math.min(1, k));

    return x * x * (3 - 2 * x);
}

function flower(x, y, r, petal) {
    ctx.strokeStyle = "#6cc04a";
    ctx.lineWidth = r * 0.22;
    ctx.beginPath();
    ctx.moveTo(x, y + r * 0.6);
    ctx.lineTo(x, y + r * 2.3);
    ctx.stroke();
    ctx.fillStyle = petal;
    for (let i = 0; i < 8; i++) {
        const a = i / 8 * Math.PI * 2;

        ctx.beginPath();
        ctx.arc(x + Math.cos(a) * r * 0.62, y + Math.sin(a) * r * 0.62, r * 0.42, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.fillStyle = "#ffd84a";
    ctx.beginPath();
    ctx.arc(x, y, r * 0.36, 0, Math.PI * 2);
    ctx.fill();
}

// "Now Loading...": the card of the video, its middle flower changing color
function drawLoading(t, alpha) {
    const w = 470 * u;
    const h = 250 * u;
    const color = LOADING[Math.floor(t / 0.8) % LOADING.length];
    const k = popIn(t / 0.4);

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(wd.width * 0.56, wd.height * 0.42);
    ctx.scale(k, k);
    ctx.shadowColor = "rgba(0, 0, 0, 0.35)";
    ctx.shadowBlur = 24 * u;
    ctx.fillStyle = `rgb(${color.map(c => Math.round(c + (255 - c) * 0.35)).join(", ")})`;
    ctx.beginPath();
    ctx.roundRect(-w / 2, -h / 2, w, h, 26 * u);
    ctx.fill();
    ctx.shadowColor = "transparent";
    // a halftone of dots, bigger toward the bottom right
    ctx.save();
    ctx.clip();
    ctx.fillStyle = "rgba(255, 255, 255, 0.35)";
    for (let y = -h / 2; y < h / 2; y += 14 * u) {
        for (let x = -w / 2; x < w / 2; x += 14 * u) {
            const r = (0.5 + (x + w / 2) / w + (y + h / 2) / h) * 1.6 * u;

            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fill();
        }
    }
    ctx.restore();
    flower(-w * 0.28, -h * 0.16, 34 * u, "rgba(255, 255, 255, 0.92)");
    flower(0, -h * 0.16, 34 * u, `rgb(${color.join(", ")})`);
    flower(w * 0.28, -h * 0.16, 34 * u, "rgba(255, 255, 255, 0.92)");
    ctx.font = `italic 800 ${22 * u}px "Adwaita Sans", sans-serif`;
    ctx.fillStyle = "#ffffff";
    ctx.textAlign = "end";
    ctx.fillText("Now Loading" + ".".repeat(Math.floor(t * 3) % 4), w / 2 - 22 * u, h / 2 - 20 * u);
    ctx.textAlign = "start";
    // the dotted line fills up to the count
    ctx.setLineDash([3 * u, 6 * u]);
    ctx.strokeStyle = "rgba(255, 255, 255, 0.85)";
    ctx.lineWidth = 2 * u;
    ctx.beginPath();
    ctx.moveTo(-w / 2 + 22 * u, h / 2 - 27 * u);
    ctx.lineTo(-w / 2 + 22 * u + (w - 222 * u) * Math.min(1, t / COUNT[0]), h / 2 - 27 * u);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
}

// the countdown of the video: three lights, red, yellow and green, lit on 1, 2 and 3
function drawLights(t, alpha) {
    const r = 56 * u;

    ctx.save();
    ctx.globalAlpha = alpha;
    COUNT.forEach((at, i) => {
        const k = popIn((t - at) / 0.35);

        if (k <= 0) {
            return;
        }
        ctx.save();
        ctx.translate(wd.width * 0.56 + (i - 1) * r * 2.7, wd.height * 0.42);
        ctx.scale(k, k);
        ctx.shadowColor = `rgb(${LIGHTS[i].join(", ")})`;
        ctx.shadowBlur = 34 * u;
        ctx.fillStyle = `rgb(${LIGHTS[i].join(", ")})`;
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowColor = "transparent";
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 6 * u;
        ctx.stroke();
        ctx.fillStyle = "rgba(255, 255, 255, 0.35)";
        ctx.beginPath();
        ctx.ellipse(-r * 0.3, -r * 0.4, r * 0.32, r * 0.18, -0.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.font = `italic 900 ${r * 1.1}px "Adwaita Sans", sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#ffffff";
        ctx.fillText(String(i + 1), 0, 4 * u);
        ctx.restore();
    });
    ctx.restore();
}

// a subtitle as in the video: white, outlined, at the bottom
function subtitle(text, y, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.font = `700 ${wd.height * 0.034}px "Adwaita Sans", sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.lineJoin = "round";
    ctx.lineWidth = wd.height * 0.008;
    ctx.strokeStyle = "rgba(20, 20, 30, 0.9)";
    ctx.strokeText(text, wd.width / 2, y);
    ctx.fillStyle = "#ffffff";
    ctx.fillText(text, wd.width / 2, y);
    ctx.restore();
}

function drawBeam(dt) {
    if (!beam) {
        return;
    }
    const t = beamTime();

    if (t >= END || (beamVideo && beamVideo.ended)) {
        beam = null;
        return;
    }
    const level = loudness();
    const shown = beamVideo && beamVideo.readyState >= 2 && t >= READY;

    if (!shown) {
        // the count: the screen darkens, the loading card fills, then the lights, a flash on each, the subtitles
        ctx.fillStyle = `rgba(4, 22, 23, ${Math.min(0.55, t * 0.25)})`;
        ctx.fillRect(0, 0, wd.width, wd.height);
        if (t < COUNT[0] + 0.1) {
            drawLoading(t, Math.min(1, (COUNT[0] + 0.1 - t) / 0.2));
        }
        if (t >= COUNT[0]) {
            drawLights(t, 1);
        }
        for (const at of COUNT) {
            if (t >= at && t < at + 0.25) {
                ctx.fillStyle = `rgba(255, 255, 255, ${0.7 * (1 - (t - at) / 0.25)})`;
                ctx.fillRect(0, 0, wd.width, wd.height);
            }
        }
        for (const [from, to, text] of LINES) {
            if (t >= from && t < to) {
                subtitle(text, wd.height * 0.88, Math.min(1, (t - from) / 0.12, (to - t) / 0.12));
            }
        }
        // no video (not made yet): the words of the beam over a violet light, on the clock
        if (!beamVideo && t >= READY) {
            ctx.fillStyle = `rgba(90, 70, 255, ${0.35 + 0.25 * level})`;
            ctx.fillRect(0, 0, wd.width, wd.height);
            bigText("MIKU MIKU BEAAAAM!!", wd.width / 2, wd.height / 2, wd.height * 0.11, popIn((t - READY) / 0.4), -0.05);
        }
        return;
    }
    // the video, cut in on "Ready?", faded out at the end (its own subtitles, hands, beam and static)
    const scale = Math.max(wd.width / beamVideo.videoWidth, wd.height / beamVideo.videoHeight);
    const w = beamVideo.videoWidth * scale;
    const h = beamVideo.videoHeight * scale;

    ctx.globalAlpha = Math.min(1, (END - t) / 0.4);
    ctx.fillStyle = "#000000";
    ctx.fillRect(0, 0, wd.width, wd.height);
    ctx.drawImage(beamVideo, (wd.width - w) / 2, (wd.height - h) / 2, w, h);
    ctx.globalAlpha = 1;
}

function rounded(x, y, w, h, r) {
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, r);
}

function mix(a, b, k) {
    return a.map((v, i) => Math.round(v + (b[i] - v) * k));
}

function drawArt(t) {
    ctx.fillStyle = "#0b2b2c";
    ctx.fillRect(0, 0, wd.width, wd.height);
    wd.cover(ctx, art, 1.01 + wd.beat * 0.006, 0, Math.sin(t * 0.5) * 3);
    // a light band sweeping the stripes
    const x = ((t * 0.08) % 1.6 - 0.3) * wd.width;
    const sweep = ctx.createLinearGradient(x - wd.width * 0.15, 0, x + wd.width * 0.15, wd.height * 0.3);

    sweep.addColorStop(0, "rgba(233, 255, 253, 0)");
    sweep.addColorStop(0.5, "rgba(233, 255, 253, 0.07)");
    sweep.addColorStop(1, "rgba(233, 255, 253, 0)");
    ctx.globalCompositeOperation = "lighter";
    ctx.fillStyle = sweep;
    ctx.fillRect(0, 0, wd.width, wd.height);
    ctx.globalCompositeOperation = "source-over";
}

// the spectrum around the 39, mirrored so the ring closes
function drawRing(t) {
    const cx = wd.width * 0.705;
    const cy = wd.height * 0.665;
    const radius = wd.height * (0.2 + wd.beat * 0.008);
    const count = wd.bars * 2;
    const turn = t * 0.15;

    const glow = ctx.createRadialGradient(cx, cy, radius * 0.6, cx, cy, radius * 1.6);
    glow.addColorStop(0, `rgba(57, 197, 187, ${0.05 + wd.bass * 0.18})`);
    glow.addColorStop(1, "rgba(57, 197, 187, 0)");
    ctx.fillStyle = glow;
    ctx.fillRect(cx - radius * 2, cy - radius * 2, radius * 4, radius * 4);

    ctx.lineCap = "round";
    ctx.lineWidth = Math.max(3, radius * 0.035);
    for (let i = 0; i < count; i++) {
        const band = i < wd.bars ? i : count - 1 - i;
        const level = Math.max(0.04 + 0.03 * Math.sin(t * 3 + i * 0.3), wd.levels[band]);
        const angle = turn + i / count * Math.PI * 2;
        const inner = radius * 1.02;
        const outer = inner + level * radius * 0.7;
        const color = mix(TEAL, PINK, band / (wd.bars - 1));

        ctx.strokeStyle = `rgba(${color.join(", ")}, 0.85)`;
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(angle) * inner, cy + Math.sin(angle) * inner);
        ctx.lineTo(cx + Math.cos(angle) * outer, cy + Math.sin(angle) * outer);
        ctx.stroke();
    }
    ctx.strokeStyle = "rgba(233, 255, 253, 0.25)";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(cx, cy, radius * 0.97, 0, Math.PI * 2);
    ctx.stroke();
}

function drawNotes(t, dt) {
    if (random() < dt * (0.8 + wd.energy * 10)) {
        notes.push({
            x: 0.08 + random() * 0.45, y: 1.02, glyph: NOTE_GLYPHS[Math.floor(random() * 4)], pink: random() < 0.5,
            size: 18 + random() * 26, speed: 0.04 + random() * 0.05, phase: random() * 6.28,
        });
    }
    ctx.textAlign = "center";
    for (let i = notes.length - 1; i >= 0; i--) {
        const note = notes[i];

        note.y -= note.speed * dt * (1 + wd.energy * 1.5);
        if (note.y < -0.05) {
            notes.splice(i, 1);
            continue;
        }
        const alpha = Math.min(1, (1 - note.y) * 3) * Math.min(1, note.y * 4) * 0.8;

        ctx.fillStyle = `rgba(${(note.pink ? PINK : TEAL).join(", ")}, ${alpha})`;
        ctx.font = `${note.size}px "Noto Sans Symbols 2", "DejaVu Sans", sans-serif`;
        ctx.fillText(note.glyph, (note.x + Math.sin(t + note.phase) * 0.015) * wd.width, note.y * wd.height);
    }
    ctx.textAlign = "start";
}

// twin-tail ribbons along the bottom
function drawRibbons(t) {
    for (const [color, offset] of [[TEAL, 0], [PINK, 2.1]]) {
        const top = [];
        const bottom = [];

        for (let x = 0; x <= wd.width; x += 16) {
            const k = x / wd.width;
            const band = Math.min(wd.bars - 1, Math.floor(k * wd.bars));
            const wave = Math.sin(k * 7 + t * 1.2 + offset) * (18 + wd.mid * 60) + wd.levels[band] * 40;
            const y = wd.height * 0.9 + wave;
            const thick = 6 + 10 * Math.sin(k * 3.14) + wd.bass * 10;

            top.push([x, y - thick]);
            bottom.push([x, y + thick]);
        }
        const fill = ctx.createLinearGradient(0, 0, wd.width, 0);

        fill.addColorStop(0, `rgba(${color.join(", ")}, 0)`);
        fill.addColorStop(0.5, `rgba(${color.join(", ")}, 0.45)`);
        fill.addColorStop(1, `rgba(${color.join(", ")}, 0)`);
        ctx.fillStyle = fill;
        ctx.beginPath();
        top.forEach(([x, y], i) => (i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y)));
        bottom.reverse().forEach(([x, y]) => ctx.lineTo(x, y));
        ctx.closePath();
        ctx.fill();
    }
}

// 39.39 FM: an LCD with the title, a tuning scale, a speaker beating with the bass, the antenna and its pink tip
function drawRadio(t) {
    const p = panel;
    const over = wd.hit(p);
    const on = radio.playing() && !wd.radio.paused;
    const lcd = { x: p.x + 20 * u, y: p.y + 38 * u, w: 262 * u, h: 52 * u };
    const speaker = { x: p.x + p.w - 66 * u, y: p.y + p.h / 2 };

    ctx.strokeStyle = `rgba(${TEAL.join(", ")}, 0.9)`;
    ctx.lineWidth = 3 * u;
    ctx.beginPath();
    ctx.moveTo(p.x + p.w - 40 * u, p.y + 4 * u);
    ctx.lineTo(p.x + p.w - 6 * u, p.y - 56 * u);
    ctx.stroke();
    ctx.fillStyle = `rgb(${PINK.join(", ")})`;
    ctx.beginPath();
    ctx.arc(p.x + p.w - 6 * u, p.y - 56 * u, (7 + (on ? wd.beat * 3 : 0)) * u, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "rgba(11, 43, 44, 0.88)";
    ctx.strokeStyle = `rgba(${TEAL.join(", ")}, ${over ? 0.95 : 0.6})`;
    ctx.lineWidth = 2 * u;
    rounded(p.x, p.y, p.w, p.h, 24 * u);
    ctx.fill();
    ctx.stroke();
    ctx.font = `800 ${12 * u}px ${MONO}`;
    ctx.fillStyle = `rgb(${PINK.join(", ")})`;
    ctx.fillText("MIKU RADIO", p.x + 22 * u, p.y + 26 * u);
    ctx.fillStyle = `rgba(${TEAL.join(", ")}, 0.8)`;
    ctx.fillText(radio.status(), p.x + 120 * u, p.y + 26 * u);

    ctx.fillStyle = "#051b1c";
    rounded(lcd.x, lcd.y, lcd.w, lcd.h, 10 * u);
    ctx.fill();
    ctx.save();
    ctx.shadowColor = `rgb(${TEAL.join(", ")})`;
    ctx.shadowBlur = 8 * u;
    ctx.fillStyle = "#7ff5ea";
    ctx.font = `700 ${13 * u}px ${MONO}`;
    ctx.fillText("39.39 FM", lcd.x + 12 * u, lcd.y + 20 * u);
    ctx.font = `600 ${14 * u}px ${JP}`;
    wd.marquee(ctx, radio.title(), lcd.x + 12 * u, lcd.y + 41 * u, lcd.w - 24 * u, t);
    ctx.restore();

    // tuning scale: the needle sits on the track
    const scale = { x: lcd.x + 8 * u, y: lcd.y + lcd.h + 10 * u, w: lcd.w - 16 * u };
    const count = Math.max(2, radio.tracks().length);

    ctx.fillStyle = `rgba(${TEAL.join(", ")}, 0.5)`;
    for (let i = 0; i < count; i++) {
        ctx.fillRect(scale.x + i / (count - 1) * scale.w, scale.y, 1.5 * u, i % 3 === 0 ? 7 * u : 4 * u);
    }
    ctx.fillStyle = `rgb(${PINK.join(", ")})`;
    ctx.fillRect(scale.x + radio.position() / (count - 1) * scale.w - 1.5 * u, scale.y - 4 * u, 3 * u, 14 * u);

    ctx.fillStyle = "#082223";
    ctx.beginPath();
    ctx.arc(speaker.x, speaker.y, 46 * u, 0, Math.PI * 2);
    ctx.fill();
    for (let ring = 1; ring <= 4; ring++) {
        for (let k = 0; k < ring * 6; k++) {
            const angle = k / (ring * 6) * Math.PI * 2 + ring;
            const level = on ? wd.levels[Math.min(wd.bars - 1, ring * 3)] : 0;

            ctx.fillStyle = `rgba(${TEAL.join(", ")}, ${0.35 + level * 0.65})`;
            ctx.beginPath();
            ctx.arc(speaker.x + Math.cos(angle) * ring * 9 * u * (1 + level * 0.12),
                speaker.y + Math.sin(angle) * ring * 9 * u * (1 + level * 0.12), 2.3 * u, 0, Math.PI * 2);
            ctx.fill();
        }
    }
    radio.buttons(ctx, lcd.x + lcd.w - (radio.actions.length - 1) * 14 * u * 2.6 - 28 * u, p.y + p.h - 44 * u, 14 * u, {
        accent: `rgb(${PINK.join(", ")})`, onAccent: "#ffffff", button: "rgba(57, 197, 187, 0.18)",
        hover: "rgba(57, 197, 187, 0.45)", icon: "#e9fffd",
    });
}

layout();
addEventListener("resize", layout);
wd.run((t, dt) => {
    drawArt(t);
    drawRing(t);
    drawRibbons(t);
    drawNotes(t, dt);
    drawRadio(t);
    drawNote(dt);
    drawBeam(dt);
});
</script>
</body>
</html>
