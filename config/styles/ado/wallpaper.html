<!doctype html>
<!-- wayland-desktop style: Ado / blue rose - live wallpaper (wd-wallpaper): the blue rose breathing under stage light
     beams that sweep with the music, 3D petals falling and turning, sparkles and a bass glow -->
<html>
<head>
<meta charset="utf-8">
<style>
    html { background: transparent; }
    body { margin: 0; height: 100vh; overflow: hidden; background: #050814; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<canvas id="main"></canvas>
<script src="../../common/wallpaper/wd.js"></script>
<script>
"use strict";

const ctx = wd.canvas("main");
const rose = wd.image("wallpaper.jpg");
const random = wd.rand(2024);
const petals = Array.from({ length: 70 }, () => petal(true));
const sparkles = Array.from({ length: 140 }, () => ({ x: random(), y: random(), phase: random() * 6.28, size: 0.6 + random() * 1.6 }));
const beams = [0.12, 0.34, 0.62, 0.86].map((x, i) => ({ x: x, phase: i * 1.7, width: 0.08 + random() * 0.06 }));

// a petal somewhere in 3D: x, y on the screen (0-1), z depth (0 far - 1 near), spin around two axes
function petal(anywhere) {
    return {
        x: random(), y: anywhere ? random() : -0.1, z: random(), spin: random() * 6.28, turn: random() * 6.28,
        speed: 0.02 + random() * 0.03, drift: (random() - 0.5) * 0.02, hue: random(),
    };
}

function drawRose(t) {
    const zoom = 1.04 + 0.015 * Math.sin(t * 0.07) + wd.beat * 0.01;

    ctx.fillStyle = "#050814";
    ctx.fillRect(0, 0, wd.width, wd.height);
    wd.cover(ctx, rose, zoom, Math.sin(t * 0.05) * 18, Math.cos(t * 0.04) * 10);
    // darker when quiet, the rose lights up with the bass (cheaper than a canvas filter)
    ctx.fillStyle = `rgba(5, 8, 20, ${Math.max(0, 0.25 - wd.bass * 0.3)})`;
    ctx.fillRect(0, 0, wd.width, wd.height);
    const shade = ctx.createLinearGradient(0, 0, wd.width * 0.7, 0);

    shade.addColorStop(0, "rgba(5, 8, 20, 0.72)");
    shade.addColorStop(1, "rgba(5, 8, 20, 0)");
    ctx.fillStyle = shade;
    ctx.fillRect(0, 0, wd.width, wd.height);
}

function drawBeams(t) {
    ctx.globalCompositeOperation = "lighter";
    for (const beam of beams) {
        const angle = Math.sin(t * 0.3 + beam.phase) * 0.35 + (wd.mid - 0.2) * 0.2;
        const x = beam.x * wd.width;
        const length = wd.height * 1.3;
        const tx = x + Math.sin(angle) * length;
        const ty = Math.cos(angle) * length;
        const light = ctx.createLinearGradient(x, 0, tx, ty);

        light.addColorStop(0, `rgba(159, 195, 255, ${0.035 + wd.beat * 0.05})`);
        light.addColorStop(1, "rgba(159, 195, 255, 0)");
        ctx.fillStyle = light;
        // soft edges: the same cone four times, narrower and narrower
        for (const part of [1, 0.7, 0.45, 0.2]) {
            const half = beam.width * wd.width * part * (1 + wd.bass * 0.5);

            ctx.beginPath();
            ctx.moveTo(x - 3, -10);
            ctx.lineTo(x + 3, -10);
            ctx.lineTo(tx + half * Math.cos(angle), ty - half * Math.sin(angle));
            ctx.lineTo(tx - half * Math.cos(angle), ty + half * Math.sin(angle));
            ctx.closePath();
            ctx.fill();
        }
    }
    ctx.globalCompositeOperation = "source-over";
}

function drawGlow() {
    const x = wd.width * 0.78;
    const y = wd.height * 0.42;
    const glow = ctx.createRadialGradient(x, y, 0, x, y, wd.height * (0.45 + wd.bass * 0.2));

    glow.addColorStop(0, `rgba(47, 107, 255, ${0.1 + wd.beat * 0.25})`);
    glow.addColorStop(1, "rgba(47, 107, 255, 0)");
    ctx.globalCompositeOperation = "lighter";
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, wd.width, wd.height);
    ctx.globalCompositeOperation = "source-over";
}

function drawPetals(t, dt) {
    petals.sort((a, b) => a.z - b.z);
    for (let i = 0; i < petals.length; i++) {
        const p = petals[i];
        const scale = 0.35 + p.z * 1.1;

        p.y += p.speed * dt * scale * (1 + wd.energy * 1.5);
        p.x += (p.drift + Math.sin(t * 0.6 + p.turn) * 0.004) * dt * 6;
        p.spin += dt * (0.6 + p.z) * (1 + wd.mid);
        p.turn += dt * 0.8;
        if (p.y > 1.1 || p.x < -0.1 || p.x > 1.1) {
            petals[i] = petal(false);
            continue;
        }
        const size = wd.height * 0.018 * scale;
        const flip = Math.cos(p.turn);
        const color = p.hue < 0.5 ? [47, 107, 255] : [159, 195, 255];

        ctx.save();
        ctx.translate(p.x * wd.width, p.y * wd.height);
        ctx.rotate(p.spin);
        ctx.scale(Math.max(0.15, Math.abs(flip)), 1);
        const fill = ctx.createLinearGradient(-size, -size, size, size);

        fill.addColorStop(0, `rgba(${color.join(", ")}, ${0.25 + p.z * 0.6})`);
        fill.addColorStop(1, `rgba(${color.join(", ")}, ${0.05 + p.z * 0.2})`);
        ctx.fillStyle = fill;
        ctx.beginPath();
        ctx.moveTo(0, -size);
        ctx.bezierCurveTo(size, -size * 0.6, size * 0.8, size * 0.7, 0, size);
        ctx.bezierCurveTo(-size * 0.8, size * 0.7, -size, -size * 0.6, 0, -size);
        ctx.fill();
        ctx.restore();
    }
}

function drawSparkles(t) {
    for (const s of sparkles) {
        const alpha = Math.max(0, Math.sin(t * (1.5 + s.size) + s.phase)) * (0.25 + wd.high * 1.2);

        ctx.fillStyle = `rgba(234, 241, 255, ${Math.min(1, alpha)})`;
        ctx.beginPath();
        ctx.arc(s.x * wd.width, s.y * wd.height, s.size, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawLine(t) {
    const base = wd.height * 0.9;

    ctx.strokeStyle = "rgba(159, 195, 255, 0.55)";
    ctx.lineWidth = 1.5;
    ctx.shadowColor = "#2f6bff";
    ctx.shadowBlur = 12;
    ctx.beginPath();
    for (let i = 0; i < wd.bars; i++) {
        const x = wd.width * (0.1 + 0.8 * i / (wd.bars - 1));
        const y = base - (wd.levels[i] * wd.height * 0.08 + 2 * Math.sin(t * 2 + i * 0.5));

        if (i === 0) {
            ctx.moveTo(x, y);
        } else {
            ctx.lineTo(x, y);
        }
    }
    ctx.stroke();
    ctx.shadowBlur = 0;
}

wd.run((t, dt) => {
    drawRose(t);
    drawGlow();
    drawBeams(t);
    drawPetals(t, dt);
    drawSparkles(t);
    drawLine(t);
});
</script>
</body>
</html>
