     and a vinyl radio to click -->

</style>
</head>

// =========================
// Emotes: rose-chan, an original blue rose mascot with the faces of the Ado memes (drawn here, no image), and the
// user's own images of ~/.local/share/wd-emotes (given by wd-wallpaper)
// =========================
const EMOTES = {};
const userEmotes = [];

window.wdEmotes = files => {
    for (const file of files) {

};

function makeEmote(name, draw) {
    const canvas = document.createElement("canvas");
    const g = canvas.getContext("2d");

    canvas.width = 96;
    canvas.height = 96;
    g.translate(48, 52);
    g.lineCap = "round";
    g.lineJoin = "round";
    draw(g);
    EMOTES[name] = canvas;
}

// a rounded petal from (x, y) toward angle: wide, its tip round
function rosePetal(g, x, y, angle, length, width, fill, edge) {
    g.save();
    g.translate(x, y);
    g.rotate(angle);
    g.beginPath();
    g.moveTo(0, 0);
    g.bezierCurveTo(-width, -length * 0.2, -width * 1.1, -length, 0, -length * 0.92);
    g.bezierCurveTo(width * 1.1, -length, width, -length * 0.2, 0, 0);
    g.fillStyle = fill;
    g.fill();
    g.strokeStyle = edge;
    g.lineWidth = Math.max(1, length * 0.06);
    g.stroke();
    g.restore();
}

// a blue rose seen from above: two leaves, three rings of petals lighter toward the heart, a bud rolled in a spiral
function roseFlower(g, x, y, r) {
    const shade = (inner, outer, size) => {
        const gradient = g.createRadialGradient(x, y, r * 0.05, x, y, r * size);

        gradient.addColorStop(0, inner);
        gradient.addColorStop(1, outer);
        return gradient;
    };

    for (const [angle, flip] of [[2.35, -1], [0.8, 1]]) {
        const leaf = g.createLinearGradient(x, y, x + Math.cos(angle) * r * 1.2, y + Math.sin(angle) * r * 1.2);

        leaf.addColorStop(0, "#1f7a43");
        leaf.addColorStop(1, "#5fcf7d");
        g.save();
        g.translate(x, y);
        g.rotate(angle + Math.PI / 2);
        g.beginPath();
        g.moveTo(0, 0);
        g.quadraticCurveTo(-r * 0.38 * flip, -r * 0.65, 0, -r * 1.25);
        g.quadraticCurveTo(r * 0.38 * flip, -r * 0.65, 0, 0);
        g.fillStyle = leaf;
        g.fill();
        g.strokeStyle = "rgba(10, 60, 30, 0.8)";
        g.lineWidth = Math.max(1, r * 0.05);
        g.beginPath();
        g.moveTo(0, -r * 0.1);
        g.lineTo(0, -r * 1.1);
        g.stroke();
        g.restore();
    }
    for (let i = 0; i < 6; i++) {
        rosePetal(g, x, y, i * Math.PI / 3 + 0.2, r * 0.98, r * 0.6, shade("#3f6cf2", "#13277f", 1), "#7fa6ff");
    }
    for (let i = 0; i < 5; i++) {
        rosePetal(g, x, y, i * Math.PI * 0.4 + 0.75, r * 0.74, r * 0.48, shade("#6d95ff", "#2448c8", 0.8), "#a9c6ff");
    }
    for (let i = 0; i < 3; i++) {
        rosePetal(g, x, y, i * Math.PI * 2 / 3 + 0.3, r * 0.48, r * 0.36, shade("#a3c0ff", "#3d66e8", 0.5), "#d3e2ff");
    }
    g.fillStyle = shade("#c9dbff", "#5b8cff", 0.3);
    g.beginPath();
    g.arc(x, y, r * 0.27, 0, Math.PI * 2);
    g.fill();
    g.strokeStyle = "#1d3fb8";
    g.lineWidth = Math.max(1, r * 0.07);
    g.beginPath();
    for (let a = 0; a < Math.PI * 3.6; a += 0.2) {
        const d = r * (0.25 - a / (Math.PI * 3.6) * 0.21);

        g.lineTo(x + Math.cos(a) * d, y + Math.sin(a) * d);
    }
    g.stroke();
    g.fillStyle = "rgba(255, 255, 255, 0.4)";
    g.beginPath();
    g.ellipse(x - r * 0.35, y - r * 0.4, r * 0.18, r * 0.09, -0.6, 0, Math.PI * 2);
    g.fill();
}

// the head: a round blue face with its rose on top
function head(g) {
    const body = g.createRadialGradient(-12, -12, 4, 0, 4, 38);

    body.addColorStop(0, "#c6dcff");
    body.addColorStop(0.55, "#5b8cff");
    body.addColorStop(1, "#2346c9");
    g.fillStyle = body;
    g.beginPath();
    g.arc(0, 4, 34, 0, Math.PI * 2);
    g.fill();
    g.strokeStyle = "#0b1a5c";
    g.lineWidth = 3;
    g.stroke();
    roseFlower(g, -20, -26, 13);
    g.fillStyle = "rgba(255, 150, 200, 0.45)";
    g.beginPath();
    g.ellipse(-20, 14, 6, 3.5, 0, 0, Math.PI * 2);
    g.ellipse(20, 14, 6, 3.5, 0, 0, Math.PI * 2);
    g.fill();
}

function line(g, points, width = 3.5, color = "#0b1a5c") {
    g.strokeStyle = color;
    g.lineWidth = width;
    g.beginPath();
    points.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y)));
    g.stroke();
}

function dot(g, x, y, r, color = "#0b1a5c") {
    g.fillStyle = color;
    g.beginPath();
    g.arc(x, y, r, 0, Math.PI * 2);
    g.fill();
}

function heart(g, x, y, s, color) {
    g.fillStyle = color;
    g.beginPath();
    g.moveTo(x, y + s * 0.9);
    g.bezierCurveTo(x - s * 1.3, y, x - s * 0.6, y - s, x, y - s * 0.3);
    g.bezierCurveTo(x + s * 0.6, y - s, x + s * 1.3, y, x, y + s * 0.9);
    g.fill();
}

        g.lineWidth = 3;

        for (const x of [-20, 0, 20]) {

function drawEmote(name, x, y, size) {
    const image = EMOTES[name];

    if (image) {
        ctx.drawImage(image, x, y, size, size);
    }
}

// text with :emote: inside, from (x, y) on the baseline, cut at width
function richText(text, x, y, size, width) {
    const end = x + width;

    for (const part of text.split(/(:[a-z]+:)/)) {
        if (!part) {
            continue;
        }
        const name = part.startsWith(":") && part.endsWith(":") ? part.slice(1, -1) : null;

        if (name && EMOTES[name]) {
            if (x + size > end) {
                return;
            }
            drawEmote(name, x, y - size * 0.82, size);
            x += size + 2 * u;
        } else {
            ctx.fillText(part, x, y, Math.max(0, end - x));
            x += ctx.measureText(part).width;
        }
        if (x >= end) {
            return;
        }
    }
}

function petal(anywhere) {
    return { x: random(), y: anywhere ? random() : -0.05, z: random(), spin: random() * 6.28, turn: random() * 6.28,
        speed: 0.015 + random() * 0.025, drift: (random() - 0.5) * 0.015, light: random() < 0.5 };
}

function layout() {
    u = Math.min(wd.width / 1920, wd.height / 1080);
    panel = { x: 56 * u, y: wd.height - 214 * u, w: 490 * u, h: 150 * u };
    wd.clickable([panel]);
}

function rounded(x, y, w, h, r) {
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, r);
}

// =========================
// Panels: dark glass, cut corners, blue corner ticks, a header with the red live dot
// =========================
function cut(x, y, w, h, c) {
    ctx.beginPath();
    ctx.moveTo(x + c, y);
    ctx.lineTo(x + w, y);
    ctx.lineTo(x + w, y + h - c);
    ctx.lineTo(x + w - c, y + h);
    ctx.lineTo(x, y + h);
    ctx.lineTo(x, y + c);
    ctx.closePath();
}

function frame(x, y, w, h, title, t, live = false, hover = false, right = "") {
    const c = 16 * u;
    const tick = 22 * u;

    cut(x, y, w, h, c);
    ctx.fillStyle = "rgba(4, 7, 18, 0.76)";
    ctx.fill();
    ctx.strokeStyle = `rgba(${SKY}, ${hover ? 0.6 : 0.2})`;
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.strokeStyle = `rgb(${BLUE})`;
    ctx.lineWidth = 2.5 * u;
    ctx.beginPath();
    ctx.moveTo(x + w - tick, y);
    ctx.lineTo(x + w, y);
    ctx.lineTo(x + w, y + tick);
    ctx.moveTo(x, y + h - tick);
    ctx.lineTo(x, y + h);
    ctx.lineTo(x + tick, y + h);
    ctx.stroke();
    if (!title) {
        return;
    }
    ctx.font = `700 ${11 * u}px ${MONO}`;
    ctx.fillStyle = `rgba(${SKY}, 0.8)`;
    ctx.fillText(title.toUpperCase(), x + c + 6 * u, y + 23 * u);
    if (right) {
        ctx.textAlign = "end";
        ctx.fillText(right, x + w - (live ? 76 : 18) * u, y + 23 * u);
        ctx.textAlign = "start";
    }
    if (live) {
        ctx.fillStyle = `rgba(${RED}, ${0.55 + 0.45 * Math.sin(t * 5)})`;
        ctx.beginPath();
        ctx.arc(x + w - 62 * u, y + 19 * u, 4 * u, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = `rgb(${RED})`;
        ctx.fillText("LIVE", x + w - 52 * u, y + 23 * u);
    }
    ctx.fillStyle = `rgba(${SKY}, 0.12)`;
    ctx.fillRect(x + 14 * u, y + 34 * u, w - 28 * u, 1);
}

// =========================
// Stage
// =========================
function drawRose(t) {
    ctx.fillStyle = "#050814";
    ctx.fillRect(0, 0, wd.width, wd.height);
    wd.cover(ctx, rose, 1.05 + 0.015 * Math.sin(t * 0.07) + wd.beat * 0.008, Math.sin(t * 0.05) * 16, Math.cos(t * 0.04) * 8);
    const shade = ctx.createLinearGradient(0, 0, wd.width * 0.75, 0);

    shade.addColorStop(0, "rgba(5, 8, 20, 0.9)");
    shade.addColorStop(0.55, "rgba(5, 8, 20, 0.55)");
    shade.addColorStop(1, "rgba(5, 8, 20, 0)");
    ctx.fillStyle = shade;
    ctx.fillRect(0, 0, wd.width, wd.height);
}

// one song title at a time, huge and faint, sliced on the kicks (drawn once in its own canvas, then copied)
const titleCanvas = document.createElement("canvas");
let titleShown = -1;

function drawTitle(t) {
    const period = 9;
    const index = Math.floor(t / period) % TRACKS.length;
    const k = (t % period) / period;
    const alpha = Math.min(1, k * 6, (1 - k) * 6) * (0.08 + wd.beat * 0.06);
    const height = Math.round(wd.height * 0.3);

    if (index !== titleShown || titleCanvas.width !== wd.width) {
        const title = titleCanvas.getContext("2d");

        titleCanvas.width = wd.width;
        titleCanvas.height = height;
        title.font = `900 ${Math.round(wd.height * 0.24)}px ${JP}`;
        title.textAlign = "center";
        title.textBaseline = "middle";
        title.fillStyle = `rgb(${SKY})`;
        title.fillText(TRACKS[index][0], wd.width / 2, height / 2);
        titleShown = index;
    }
    const top = wd.height * 0.66 - height / 2;
    const slice = height / 5;

    ctx.globalAlpha = alpha;
    for (let i = 0; i < 5; i++) {
        const shift = wd.beat > 0.5 ? (random() - 0.5) * 40 * u * wd.beat : 0;

        ctx.drawImage(titleCanvas, 0, i * slice, wd.width, slice, shift, top + i * slice, wd.width, slice);
    }
    ctx.globalAlpha = 1;
}

// =========================
// The stage of the concerts (K-Arena 2024, Budokan 2023, the National Stadium 2024), drawn: the Ado Box - a dark cube
// closed by a lattice of bars, lit from behind, its head band of small windows - on a stage edged with lights; the LED
// wall behind it changes its show (an arch of lights, the heartbeat on a grid, ribbons of light, a burst of rays), the
// lasers fire on the kicks, the crowd waves its penlights
// =========================
const SHOWS = [
    { name: "arch", light: "226, 236, 255", lamps: ["255, 255, 255", "120, 170, 255"], pen: "110, 160, 255" },
    { name: "heart", light: "150, 225, 255", lamps: ["255, 70, 170", "90, 200, 255"], pen: "255, 90, 180" },
    { name: "ribbons", light: "205, 200, 255", lamps: ["190, 140, 255", "120, 230, 255"], pen: "110, 160, 255" },
    { name: "burst", light: "255, 255, 255", lamps: ["255, 255, 255", "255, 120, 220"], pen: "160, 200, 255" },
];
const SHOW_TIME = 16;
const SHOW_FADE = 1.5;
// the LED wall is drawn at half size, then laid over the rose with soft edges
const wall = document.createElement("canvas");
const WALL_SCALE = 0.5;
const ribbons = Array.from({ length: 10 }, () => ({ y: 0.12 + random() * 0.75, amp: 0.04 + random() * 0.14,
    tilt: (random() - 0.5) * 0.5, speed: 0.1 + random() * 0.25, phase: random() * 6.28, width: 1 + random() * 2.5 }));
const crowd = Array.from({ length: 42 }, (_, i) => ({ x: (i + random() * 0.7) / 42, size: 0.75 + random() * 0.5,
    light: random() < 0.6, phase: random() * 6.28, back: i % 2 === 1 }));

// where the box stands: centered on cx, its floor on the stage, w x h
function stage() {
    const h = wd.height * 0.37;
    const w = h * 0.84;
    const cx = wd.width * 0.31;
    const floor = wd.height * 0.8;

    return { cx: cx, floor: floor, w: w, h: h, x: cx - w / 2, y: floor - h, cy: floor - h * 0.5 };
}

// one heartbeat over its period (0-1): a small bump, the spike (down, up, down), a slow bump
function pulse(p) {
    const bump = (center, width, height) => height * Math.exp(-(((p - center) / width) ** 2));

    return bump(0.2, 0.03, 0.12) - bump(0.36, 0.012, 0.25) + bump(0.4, 0.014, 1) - bump(0.44, 0.012, 0.4)
        + bump(0.62, 0.05, 0.22);
}

function drawShow(g, name, t, s) {
    const right = wd.width * 0.66;

    if (name === "arch") {
        // a ring of lights standing on the stage around the box, a white haze inside
        const r = s.h * 0.78;
        const cy = s.cy + s.h * 0.02;
        const haze = g.createRadialGradient(s.cx, cy, 0, s.cx, cy, r);

        haze.addColorStop(0, `rgba(235, 242, 255, ${0.55 + wd.bass * 0.3})`);
        haze.addColorStop(0.6, `rgba(${BLUE}, 0.35)`);
        haze.addColorStop(1, `rgba(${BLUE}, 0)`);
        g.fillStyle = haze;
        g.fillRect(s.cx - r, cy - r, r * 2, r * 2);
        for (let i = 0; i < 60; i++) {
            const a = i / 60 * Math.PI * 2;

            if (Math.sin(a) > 0.62) {
                continue;
            }
            const on = 0.35 + 0.65 * Math.max(0.5 + 0.5 * Math.sin(a * 3 - t * 4), wd.beat);
            const px = s.cx + Math.cos(a) * r;
            const py = cy + Math.sin(a) * r;

            g.fillStyle = `rgba(200, 220, 255, ${on * 0.25})`;
            g.beginPath();
            g.arc(px, py, 14 * u, 0, Math.PI * 2);
            g.fill();
            g.fillStyle = `rgba(255, 255, 255, ${on})`;
            g.beginPath();
            g.arc(px, py, 4.5 * u, 0, Math.PI * 2);
            g.fill();
        }
    } else if (name === "heart") {
        // 心臓: a blue grid and the heartbeat running behind the box, its spike on the kicks
        const glow = g.createRadialGradient(s.cx, s.cy, 0, s.cx, s.cy, s.h * 1.6);
        const step = s.h * 0.16;

        glow.addColorStop(0, `rgba(80, 200, 255, ${0.45 + wd.bass * 0.25})`);
        glow.addColorStop(1, "rgba(20, 60, 160, 0)");
        g.fillStyle = glow;
        g.fillRect(s.cx - s.h * 1.6, s.cy - s.h * 1.6, s.h * 3.2, s.h * 3.2);
        g.strokeStyle = "rgba(120, 210, 255, 0.35)";
        g.lineWidth = 2 * u;
        g.beginPath();
        for (let x = s.cx % step; x < right; x += step) {
            g.moveTo(x, 0);
            g.lineTo(x, s.floor);
        }
        for (let y = s.floor % step; y < s.floor; y += step) {
            g.moveTo(0, y);
            g.lineTo(right, y);
        }
        g.stroke();
        const base = s.y + s.h * 0.32;
        const amp = s.h * (0.3 + wd.beat * 0.25);
        const period = s.h * 1.1;
        const shift = t * s.h * 0.9;

        for (const [width, alpha] of [[10 * u, 0.25], [3 * u, 1]]) {
            g.strokeStyle = `rgba(255, 70, 170, ${alpha})`;
            g.lineWidth = width;
            g.beginPath();
            for (let x = 0; x <= right; x += 4 * u) {
                const y = base - amp * pulse(((x + shift) % period) / period);

                if (x === 0) {
                    g.moveTo(x, y);
                } else {
                    g.lineTo(x, y);
                }
            }
            g.stroke();
        }
    } else if (name === "ribbons") {
        // ribbons of light crossing the wall, faster with the music
        const sky = g.createLinearGradient(0, 0, 0, s.floor);

        sky.addColorStop(0, "rgba(40, 90, 255, 0.25)");
        sky.addColorStop(1, "rgba(120, 180, 255, 0.45)");
        g.fillStyle = sky;
        g.fillRect(0, 0, right, s.floor);
        g.lineCap = "round";
        for (const ribbon of ribbons) {
            g.strokeStyle = `rgba(${ribbon.width > 2 ? "255, 255, 255" : "150, 230, 255"}, ${0.35 + wd.energy * 0.4})`;
            g.lineWidth = ribbon.width * 2 * u * (1 + wd.bass);
            g.beginPath();
            for (let i = 0; i <= 40; i++) {
                const k = i / 40;
                const y = (ribbon.y + (k - 0.5) * ribbon.tilt) * s.floor
                    + Math.sin(k * 6 + t * ribbon.speed * 6 + ribbon.phase) * ribbon.amp * s.floor;

                if (i === 0) {
                    g.moveTo(k * right, y);
                } else {
                    g.lineTo(k * right, y);
                }
            }
            g.stroke();
        }
    } else {
        // a burst of rays from behind the box, its core flashing on the kicks
        const cy = s.cy - s.h * 0.1;
        const core = g.createRadialGradient(s.cx, cy, 0, s.cx, cy, s.h * 0.9);

        core.addColorStop(0, `rgba(255, 255, 255, ${0.7 + wd.beat * 0.3})`);
        core.addColorStop(0.4, "rgba(140, 200, 255, 0.4)");
        core.addColorStop(1, `rgba(${BLUE}, 0)`);
        g.fillStyle = core;
        g.fillRect(s.cx - s.h, cy - s.h, s.h * 2, s.h * 2);
        for (let i = 0; i < 40; i++) {
            const a = i / 40 * Math.PI * 2 + t * 0.08;
            const spread = 0.012 + (i % 3) * 0.006;
            const length = wd.width * (0.35 + 0.15 * Math.sin(i * 7.1 + t * 1.3)) * (0.8 + wd.bass * 0.4);

            g.fillStyle = `rgba(${i % 3 ? "170, 215, 255" : "255, 255, 255"}, ${0.22 + wd.beat * 0.25})`;
            g.beginPath();
            g.moveTo(s.cx, cy);
            g.lineTo(s.cx + Math.cos(a - spread) * length, cy + Math.sin(a - spread) * length);
            g.lineTo(s.cx + Math.cos(a + spread) * length, cy + Math.sin(a + spread) * length);
            g.closePath();
            g.fill();
        }
    }
}

function drawWall(t, s) {
    const width = Math.round(wd.width * 0.66 * WALL_SCALE);
    const height = Math.round(s.floor * WALL_SCALE);
    const index = Math.floor(t / SHOW_TIME);
    const k = t - index * SHOW_TIME;
    const g = wall.getContext("2d");

    if (wall.width !== width || wall.height !== height) {
        wall.width = width;
        wall.height = height;
    }
    g.globalCompositeOperation = "source-over";
    g.clearRect(0, 0, width, height);
    g.save();
    g.scale(WALL_SCALE, WALL_SCALE);
    g.globalCompositeOperation = "lighter";
    // the next show fades in over the last one
    if (k < SHOW_FADE && index > 0) {
        g.globalAlpha = 1 - k / SHOW_FADE;
        drawShow(g, SHOWS[(index - 1) % SHOWS.length].name, t, s);
    }
    g.globalAlpha = Math.min(1, k / SHOW_FADE);
    drawShow(g, SHOWS[index % SHOWS.length].name, t, s);
    g.restore();
    // soft edges: the wall melts into the rose
    const mask = g.createRadialGradient(s.cx * WALL_SCALE, s.cy * WALL_SCALE, s.h * WALL_SCALE * 0.3,
        s.cx * WALL_SCALE, s.cy * WALL_SCALE, wd.width * 0.36 * WALL_SCALE);

    mask.addColorStop(0, "rgba(0, 0, 0, 1)");
    mask.addColorStop(1, "rgba(0, 0, 0, 0)");
    g.globalCompositeOperation = "destination-in";
    g.fillStyle = mask;
    g.fillRect(0, 0, width, height);
    g.globalCompositeOperation = "source-over";
    ctx.globalCompositeOperation = "lighter";
    ctx.drawImage(wall, 0, 0, width / WALL_SCALE, height / WALL_SCALE);
    // a white flash when the show changes
    if (k < 0.5 && index > 0) {
        const flash = ctx.createRadialGradient(s.cx, s.cy, 0, s.cx, s.cy, s.h * 1.4);

        flash.addColorStop(0, `rgba(255, 255, 255, ${(0.5 - k) * 1.2})`);
        flash.addColorStop(1, "rgba(255, 255, 255, 0)");
        ctx.fillStyle = flash;
        ctx.fillRect(s.cx - s.h * 1.4, s.cy - s.h * 1.4, s.h * 2.8, s.h * 2.8);
    }
    ctx.globalCompositeOperation = "source-over";
}

// the lasers from the stage, on the kicks
function drawLasers(t, s) {
    const flash = Math.max(wd.beat, 0.15 * wd.energy);

    if (flash < 0.05) {
        return;
    }
    ctx.globalCompositeOperation = "lighter";
    ctx.lineWidth = 1.6 * u;
    for (let i = 0; i < 8; i++) {
        const side = i < 4 ? -1 : 1;
        const fx = s.cx + side * s.w * (0.9 + (i % 4) * 0.35);
        const a = -Math.PI / 2 + side * (0.2 + 0.45 * (0.5 + 0.5 * Math.sin(t * 0.7 + i)));
        const length = wd.height * 0.85;
        const tx = fx + Math.cos(a) * length;
        const ty = s.floor + Math.sin(a) * length;
        const beam = ctx.createLinearGradient(fx, s.floor, tx, ty);

        beam.addColorStop(0, `rgba(${i % 2 ? "120, 160, 255" : "200, 120, 255"}, ${0.7 * flash})`);
        beam.addColorStop(1, "rgba(120, 160, 255, 0)");
        ctx.strokeStyle = beam;
        ctx.beginPath();
        ctx.moveTo(fx, s.floor);
        ctx.lineTo(tx, ty);
        ctx.stroke();
    }
    ctx.globalCompositeOperation = "source-over";
}

// Ado as a silhouette against the light, as on stage: the long flared dress with its ruffles, the hair, the microphone
// at her mouth and the other arm in the big gestures of the concerts; feet at (x, y), height h
function drawSilhouette(x, y, h, t) {
    const sway = 0.05 * Math.sin(t * 1.1) + wd.beat * 0.04;
    const gesture = 0.5 + 0.5 * Math.sin(t * 0.8 + Math.sin(t * 0.37) * 2);
    const wave = Math.sin(t * 2.3);
    const at = (px, py) => [x + px * h, y + py * h];
    // the upper body leans around the waist
    const up = (px, py) => {
        const dy = py + 0.5;

        return at(px * Math.cos(sway) - dy * Math.sin(sway), -0.5 + px * Math.sin(sway) + dy * Math.cos(sway));
    };
    const limb = (points, width) => {
        ctx.lineWidth = width * h;
        ctx.beginPath();
        points.forEach((point, i) => (i ? ctx.lineTo(...point) : ctx.moveTo(...point)));
        ctx.stroke();
    };
    const blob = (point, rx, ry) => {
        ctx.beginPath();
        ctx.ellipse(...point, rx * h, ry * h, sway, 0, Math.PI * 2);
        ctx.fill();
    };
    const mix = (a, b) => [a[0] + (b[0] - a[0]) * gesture, a[1] + (b[1] - a[1]) * gesture];
    const shape = () => {
        // the dress: a wide bell from the waist, the hem in ruffles
        const hemLeft = -0.3 - 0.02 * wave;
        const hemRight = 0.3 + 0.02 * wave;

        ctx.beginPath();
        ctx.moveTo(...up(-0.06, -0.5));
        ctx.quadraticCurveTo(...at(-0.19 - 0.02 * wave, -0.32), ...at(hemLeft, -0.03));
        for (let i = 0; i < 7; i++) {
            ctx.quadraticCurveTo(...at(hemLeft + (hemRight - hemLeft) * (i + 0.5) / 7, 0.01),
                ...at(hemLeft + (hemRight - hemLeft) * (i + 1) / 7, -0.03));
        }
        ctx.quadraticCurveTo(...at(0.19 + 0.02 * wave, -0.32), ...up(0.06, -0.5));
        ctx.closePath();
        ctx.fill();
        // the bodice, the shoulders, the neck
        ctx.beginPath();
        ctx.moveTo(...up(-0.062, -0.5));
        ctx.lineTo(...up(-0.085, -0.7));
        ctx.quadraticCurveTo(...up(-0.09, -0.745), ...up(-0.04, -0.75));
        ctx.lineTo(...up(0.04, -0.75));
        ctx.quadraticCurveTo(...up(0.09, -0.745), ...up(0.085, -0.7));
        ctx.lineTo(...up(0.062, -0.5));
        ctx.closePath();
        ctx.fill();
        limb([up(0, -0.74), up(0.005, -0.79)], 0.035);
        // the microphone at her mouth
        const micShoulder = up(0.08, -0.72);
        const micElbow = up(0.105, -0.6);
        const micHand = up(0.04, -0.745);

        limb([micShoulder, micElbow, micHand], 0.034);
        blob(micHand, 0.022, 0.022);
        limb([micHand, up(0.028, -0.79)], 0.016);
        blob(up(0.024, -0.8), 0.02, 0.02);
        // the other arm: low and open, then raised high
        const shoulder = up(-0.08, -0.72);
        const elbow = mix(up(-0.17, -0.6), up(-0.17, -0.82));
        const hand = mix(up(-0.24 - 0.01 * wave, -0.47), up(-0.3, -0.97 + 0.02 * wave));

        limb([shoulder, elbow, hand], 0.032);
        blob(hand, 0.022, 0.022);
        // the head and the hair, its volume and its long locks
        blob(up(0.005, -0.83), 0.064, 0.07);
        blob(up(-0.008, -0.85), 0.08, 0.065);
        ctx.beginPath();
        ctx.moveTo(...up(-0.075, -0.86));
        ctx.quadraticCurveTo(...up(-0.13 - 0.02 * wave, -0.74), ...up(-0.12 - 0.03 * wave, -0.56));
        ctx.quadraticCurveTo(...up(-0.09, -0.58), ...up(-0.065, -0.6));
        ctx.quadraticCurveTo(...up(-0.07, -0.74), ...up(-0.03, -0.8));
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(...up(0.07, -0.86));
        ctx.quadraticCurveTo(...up(0.12 + 0.015 * wave, -0.74), ...up(0.11 + 0.02 * wave, -0.58));
        ctx.quadraticCurveTo(...up(0.09, -0.6), ...up(0.07, -0.62));
        ctx.quadraticCurveTo(...up(0.075, -0.74), ...up(0.04, -0.8));
        ctx.closePath();
        ctx.fill();
    };

    ctx.save();
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.strokeStyle = "#02030a";
    ctx.fillStyle = "#02030a";
    // the light behind her wraps around the shape first, then the black shape
    ctx.shadowColor = "rgba(255, 255, 255, 0.85)";
    ctx.shadowBlur = 12 * u;
    shape();
    ctx.shadowBlur = 0;
    shape();
    ctx.restore();
}

// the box: its side seen a little, the light behind its bars, her inside, the lattice, the head band of small windows
function drawBox(t, s, show) {
    const bar = s.h * 0.012;
    const side = s.h * 0.028;
    const top = s.h * 0.13;
    const plinth = s.h * 0.07;
    const depth = s.w * 0.13;
    const inner = { x: s.x + side, y: s.y + top, w: s.w - side * 2, h: s.h - top - plinth };
    const dark = "#03050c";

    ctx.fillStyle = dark;
    ctx.beginPath();
    ctx.moveTo(s.x + s.w, s.y);
    ctx.lineTo(s.x + s.w + depth, s.y + s.h * 0.035);
    ctx.lineTo(s.x + s.w + depth, s.y + s.h * 0.98);
    ctx.lineTo(s.x + s.w, s.y + s.h);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = `rgba(${show.light}, ${0.2 + wd.bass * 0.15})`;
    for (let i = 0; i < 3; i++) {
        const fx = s.x + s.w + depth * (i + 0.6) / 3.4;
        const lean = s.h * 0.035 * (i + 0.6) / 3.4;

        ctx.fillRect(fx, inner.y + lean, depth * 0.11, inner.h - lean * 1.5);
    }
    const light = ctx.createRadialGradient(s.cx, inner.y + inner.h * 0.45, 0, s.cx, inner.y + inner.h * 0.45, inner.h * 0.85);

    light.addColorStop(0, "rgba(255, 255, 255, 0.97)");
    light.addColorStop(0.45, `rgba(${show.light}, ${0.85 + wd.beat * 0.15})`);
    light.addColorStop(1, `rgba(${BLUE}, 0.92)`);
    ctx.fillStyle = light;
    ctx.fillRect(inner.x, inner.y, inner.w, inner.h);
    drawSilhouette(s.cx + s.w * 0.04, inner.y + inner.h, inner.h * 0.78, t);
    ctx.fillStyle = dark;
    for (let i = 1; i < 12; i++) {
        ctx.fillRect(inner.x + inner.w * i / 12 - bar / 2, inner.y, bar, inner.h);
    }
    for (let i = 1; i < 6; i++) {
        ctx.fillRect(inner.x, inner.y + inner.h * i / 6 - bar / 2, inner.w, bar);
    }
    ctx.fillRect(s.x, s.y, s.w, top);
    ctx.fillRect(s.x, s.y + s.h - plinth, s.w, plinth);
    ctx.fillRect(s.x, s.y, side, s.h);
    ctx.fillRect(s.x + s.w - side, s.y, side, s.h);
    // the windows of the head band, a chase of light running through them
    const columns = 24;
    const cell = (s.w - side * 2) / columns;

    for (let row = 0; row < 3; row++) {
        for (let i = 0; i < columns; i++) {
            const on = 0.25 + 0.5 * Math.max(0, Math.sin(i * 0.5 - t * 3 + row)) + wd.beat * 0.25;

            ctx.fillStyle = `rgba(${show.light}, ${Math.min(1, on)})`;
            ctx.fillRect(s.x + side + i * cell + cell * 0.18, s.y + top * (0.16 + row * 0.27), cell * 0.64, top * 0.17);
        }
    }
    ctx.strokeStyle = `rgba(${show.light}, ${0.35 + wd.beat * 0.4})`;
    ctx.lineWidth = 1.5 * u;
    ctx.strokeRect(s.x - 1.5 * u, s.y - 1.5 * u, s.w + 3 * u, s.h + 3 * u);
}

// the stage under the box and the moving lights along its edge, their beams up into the haze
function drawPlatform(t, s, show) {
    const left = 0;
    const right = s.cx + s.w * 1.25;
    const height = s.h * 0.12;
    const slab = ctx.createLinearGradient(left, 0, right, 0);

    slab.addColorStop(0, "rgba(2, 3, 10, 1)");
    slab.addColorStop(0.85, "rgba(2, 3, 10, 0.95)");
    slab.addColorStop(1, "rgba(2, 3, 10, 0)");
    ctx.fillStyle = slab;
    ctx.fillRect(left, s.floor, right - left, height);
    ctx.globalCompositeOperation = "lighter";
    for (let i = 0; i < 12; i++) {
        const lx = s.cx - s.w * 1.45 + i * s.w * 0.24;
        const ly = s.floor + height * 0.45;
        const on = 0.35 + 0.65 * Math.max(wd.beat, 0.5 + 0.5 * Math.sin(t * 3 + i * 0.8));
        const color = show.lamps[i % 2];
        const glow = ctx.createRadialGradient(lx, ly, 0, lx, ly, 16 * u);

        glow.addColorStop(0, `rgba(${color}, ${on})`);
        glow.addColorStop(1, `rgba(${color}, 0)`);
        ctx.fillStyle = glow;
        ctx.fillRect(lx - 16 * u, ly - 16 * u, 32 * u, 32 * u);
        const a = -Math.PI / 2 + Math.sin(t * 0.9 + i * 1.3) * 0.35;
        const reach = s.h * 0.9;
        const beam = ctx.createLinearGradient(lx, ly, lx + Math.cos(a) * reach, ly + Math.sin(a) * reach);

        beam.addColorStop(0, `rgba(${color}, ${0.12 * on})`);
        beam.addColorStop(1, `rgba(${color}, 0)`);
        ctx.fillStyle = beam;
        ctx.beginPath();
        ctx.moveTo(lx, ly);
        ctx.lineTo(lx + Math.cos(a - 0.08) * reach, ly + Math.sin(a - 0.08) * reach);
        ctx.lineTo(lx + Math.cos(a + 0.08) * reach, ly + Math.sin(a + 0.08) * reach);
        ctx.closePath();
        ctx.fill();
    }
    ctx.globalCompositeOperation = "source-over";
}

// the crowd in front of the stage: heads and shoulders, the penlights waving with the music
function drawCrowd(t, show) {
    for (const fan of crowd) {
        const fx = fan.x * wd.width * 0.64;
        const r = wd.height * 0.028 * fan.size;
        const fy = wd.height - r * (fan.back ? 1.6 : 0.7);

        ctx.globalAlpha = Math.min(1, (1 - fan.x) * 4);
        if (fan.light) {
            const a = Math.sin(t * 2.4 + fan.phase) * 0.45 + wd.beat * 0.3 * Math.sin(fan.phase);
            const hx = fx + r * 0.9;
            const hy = fy - r * 1.3;
            const tx = hx + Math.sin(a) * r * 2.4;
            const ty = hy - Math.cos(a) * r * 2.4;

            ctx.strokeStyle = "#010208";
            ctx.lineCap = "round";
            ctx.lineWidth = r * 0.35;
            ctx.beginPath();
            ctx.moveTo(fx + r * 0.6, fy + r * 0.4);
            ctx.lineTo(hx, hy);
            ctx.stroke();
            ctx.globalCompositeOperation = "lighter";
            for (const [width, alpha] of [[8 * u, 0.3], [3 * u, 1]]) {
                ctx.strokeStyle = `rgba(${show.pen}, ${alpha})`;
                ctx.lineWidth = width;
                ctx.beginPath();
                ctx.moveTo(hx, hy);
                ctx.lineTo(tx, ty);
                ctx.stroke();
            }
            ctx.globalCompositeOperation = "source-over";
        }
        ctx.fillStyle = "#010208";
        ctx.beginPath();
        ctx.arc(fx, fy, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(fx, fy + r * 1.7, r * 1.8, r * 1.1, 0, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
}

// The stage from the concerts themselves: clips made by wd-wallpaper (radio.json "media": wide shots of official live
// videos, personal copies), one after the other for their colors - the blue Ado Box of K-Arena, the red theater of the
// Tokyo Dome, the fire of Hibana, the lasers of Odo, the golden sun of the Budokan, the red and cyan cage of Usseewa -
// their edges melted into the rose; the drawn stage above until one is made
const STAGES = ["stage", "stage-red", "stage-fire", "stage-odo", "stage-gold", "stage-usseewa"];
let stageVideo = null;
// the time the first frame showed (0: not yet)
let stageShown = 0;
let stageTry = -1;
const stageLayer = document.createElement("canvas");

// the clip playing and where, for the page of the lock (wd.keep / wd.restore)
let resumed = null;

wd.keep = () => {
    const media = wd.station && wd.station.media || {};
    const clip = stageVideo ? STAGES.find(key => media[key] === stageVideo.src) : null;

    return clip ? { clip: clip, time: stageVideo.currentTime } : null;
};
wd.restore = kept => {
    resumed = kept;
};

// the next clip that is made, when one ends (a single one loops)
function nextStage() {
    const media = wd.station.media || {};
    const made = STAGES.filter(key => media[key]);
    const now = made.findIndex(key => stageVideo.src === media[key]);

    stageVideo.src = media[made[(now + 1) % made.length]];
    wd.play(stageVideo);
}

function drawConcert() {
    const w = wd.width * 0.68;
    // 16:9 while the next clip loads (its size is 0 until then)
    const h = w * (stageVideo.videoWidth ? stageVideo.videoHeight / stageVideo.videoWidth : 9 / 16);
    const x = wd.width * 0.31 - w / 2;
    const y = wd.height * 0.54 - h / 2;
    const g = stageLayer.getContext("2d");
    const lw = Math.round(w / 2);
    const lh = Math.round(h / 2);

    if (stageLayer.width !== lw || stageLayer.height !== lh) {
        stageLayer.width = lw;
        stageLayer.height = lh;
    }
    g.globalCompositeOperation = "source-over";
    // between two clips the last frame stays
    if (stageVideo.readyState < 2) {
        ctx.drawImage(stageLayer, x, y, w, h);
        return;
    }
    g.drawImage(stageVideo, 0, 0, lw, lh);
    // an oval mask: the shot fades into the rose around it
    g.save();
    g.globalCompositeOperation = "destination-in";
    g.translate(lw / 2, lh / 2);
    g.scale(1, lh / lw);
    const mask = g.createRadialGradient(0, 0, lw * 0.28, 0, 0, lw / 2);

    mask.addColorStop(0, "rgba(0, 0, 0, 1)");
    mask.addColorStop(1, "rgba(0, 0, 0, 0)");
    g.fillStyle = mask;
    g.fillRect(-lw / 2, -lw / 2, lw, lw);
    g.restore();
    ctx.drawImage(stageLayer, x, y, w, h);
    // the kicks light it up a little more
    if (wd.beat > 0.2) {
        ctx.globalCompositeOperation = "lighter";
        ctx.globalAlpha = wd.beat * 0.25;
        ctx.drawImage(stageLayer, x, y, w, h);
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = "source-over";
    }
}

function drawCage(t) {
    const s = stage();
    const show = SHOWS[Math.floor(t / SHOW_TIME) % SHOWS.length];

    if (!stageVideo && wd.station && wd.station.media) {
        // the page of the lock goes on with the clip of the wallpaper, where it was
        const first = resumed && wd.station.media[resumed.clip] ? resumed.clip : STAGES.find(key => wd.station.media[key]);

        stageVideo = first ? wd.video(first, { loop: false }) : null;
        if (stageVideo && resumed && resumed.clip === first) {
            stageVideo.currentTime = resumed.time;
        }
        if (stageVideo) {
            stageVideo.addEventListener("ended", nextStage);
            wd.play(stageVideo);
        }
    }
    // a play() refused (made before the wallpaper shows, or no user gesture yet): asked again once a second while it
    // should play (not held by the wallpaper)
    if (stageVideo && stageVideo.paused && !stageVideo.ended && !stageVideo.wdHeld && t - stageTry > 1) {
        stageTry = t;
        wd.play(stageVideo);
    }
    if (stageVideo && (stageShown || stageVideo.readyState >= 2)) {
        // the first frame fades in
        stageShown = stageShown || Math.max(t, 0.001);
        ctx.globalAlpha = Math.min(1, (t - stageShown) / 0.6);
        drawConcert();
        ctx.globalAlpha = 1;
        return;
    }
    // nothing while the page waits for its clips (or the first frame): the drawn stage only when none is made
    if (!wd.station || stageVideo) {
        return;
    }
    drawWall(t, s);
    drawLasers(t, s);
    drawBox(t, s, show);
    drawPlatform(t, s, show);
    drawCrowd(t, show);
}

function drawPetals(t, dt) {
    for (let i = 0; i < petals.length; i++) {
        const p = petals[i];
        const scale = 0.35 + p.z;

        p.y += p.speed * dt * scale * (1 + wd.energy * 1.5);
        p.x += (p.drift + Math.sin(t * 0.6 + p.turn) * 0.003) * dt * 6;
        p.spin += dt * (0.5 + p.z) * (1 + wd.mid);
        p.turn += dt * 0.8;
        if (p.y > 1.05 || p.x < -0.05 || p.x > 1.05) {
            petals[i] = petal(false);
            continue;
        }
        const size = wd.height * 0.016 * scale;

        ctx.save();
        ctx.translate(p.x * wd.width, p.y * wd.height);
        ctx.rotate(p.spin);
        ctx.scale(Math.max(0.15, Math.abs(Math.cos(p.turn))), 1);
        ctx.fillStyle = `rgba(${p.light ? SKY : BLUE}, ${0.2 + p.z * 0.55})`;
        ctx.beginPath();
        ctx.moveTo(0, -size);
        ctx.bezierCurveTo(size, -size * 0.6, size * 0.8, size * 0.7, 0, size);
        ctx.bezierCurveTo(-size * 0.8, size * 0.7, -size, -size * 0.6, 0, -size);
        ctx.fill();
        ctx.restore();
    }
}

// =========================
// World domination
// =========================
function drawDomination(t) {
    const x = 56 * u;
    const y = 82 * u;
    const w = 660 * u;
    const h = 214 * u;
    const percent = Math.min(100, 87 + t / 60);
    const conquered = Math.floor(CITIES.length * percent / 100);
    const glitch = wd.beat > 0.4 ? wd.beat * 4 * u : 0;
    const segments = 24;

    frame(x, y, w, h, "ado // protocol", t, true);
    // 世界征服, written down the left side
    ctx.font = `900 ${30 * u}px ${JP}`;
    ctx.fillStyle = `rgba(${SKY}, 0.9)`;
    [..."世界征服"].forEach((ch, i) => ctx.fillText(ch, x + 22 * u, y + 76 * u + i * 33 * u));
    const left = x + 74 * u;

    ctx.font = `italic 900 ${34 * u}px ${SANS}`;
    if (glitch) {
        ctx.fillStyle = `rgba(${RED}, 0.65)`;
        ctx.fillText("WORLD DOMINATION", left - glitch, y + 84 * u);
        ctx.fillStyle = "rgba(0, 220, 255, 0.65)";
        ctx.fillText("WORLD DOMINATION", left + glitch, y + 84 * u);
    }
    ctx.fillStyle = "#eaf1ff";
    ctx.fillText("WORLD DOMINATION", left, y + 84 * u);
    // segmented progress, the last segment blinks
    const filled = percent / 100 * segments;
    const segment = 13 * u;

    for (let i = 0; i < segments; i++) {
        const on = i < Math.floor(filled) || (i === Math.floor(filled) && Math.sin(t * 8) > 0);

        ctx.fillStyle = on ? (i > segments - 4 ? `rgb(${RED})` : `rgb(${i % 2 ? SKY : BLUE})`) : "rgba(255, 255, 255, 0.08)";
        ctx.fillRect(left + i * (segment + 3 * u), y + 106 * u, segment, 12 * u);
    }
    // the percentage, its emote right after it (measured: never on the digits), the stats after both
    const label = `${percent.toFixed(1)}%`;

    ctx.font = `900 ${46 * u}px ${SANS}`;
    ctx.fillStyle = "#eaf1ff";
    ctx.fillText(label, left, y + 170 * u);
    const end = left + ctx.measureText(label).width;
    const stats = end + 54 * u;

    drawEmote(percent < 100 ? "rose" : "crown", end + 10 * u, y + 135 * u, 32 * u);
    ctx.font = `600 ${12 * u}px ${MONO}`;
    ctx.fillStyle = `rgba(${SKY}, 0.8)`;
    ctx.fillText(`CITIES  ${conquered}/${CITIES.length}`, stats, y + 148 * u);
    ctx.fillText(`STATUS  ${percent < 100 ? "SPREADING" : "DONE \u00b7 NEXT: MOON"}`, stats, y + 168 * u);
    ctx.fillText(`FANS    ${(393939 + Math.floor(t * 7)).toLocaleString("en")}`, stats, y + 188 * u);
    drawGlobe(t, x + w - 104 * u, y + 122 * u, 74 * u, conquered);
}

// the earth as dots inside an orbit, a scan line, the conquered cities as blue roses
function drawGlobe(t, cx, cy, r, conquered) {
    const spin = t * 0.35;
    const tilt = 0.45;
    // the north leans toward us: most of the cities face the screen
    const point = (lat, lon) => {
        const a = lat * Math.PI / 180;
        const b = lon * Math.PI / 180 + spin;
        const y = Math.sin(a);
        const z = Math.cos(a) * Math.cos(b);

        return { x: cx + Math.cos(a) * Math.sin(b) * r, y: cy - (y * Math.cos(tilt) - z * Math.sin(tilt)) * r,
            z: y * Math.sin(tilt) + z * Math.cos(tilt) };
    };

    ctx.fillStyle = "rgba(2, 4, 12, 0.9)";
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
    for (let lat = -75; lat <= 75; lat += 12.5) {
        for (let lon = 0; lon < 360; lon += 10) {
            const p = point(lat, lon);

            if (p.z > 0) {
                ctx.fillStyle = `rgba(${SKY}, ${0.12 + p.z * 0.5})`;
                ctx.fillRect(p.x - 1, p.y - 1, 2 * u, 2 * u);
            }
        }
    }
    ctx.strokeStyle = `rgba(${SKY}, 0.55)`;
    ctx.lineWidth = 1.2 * u;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.strokeStyle = `rgba(${BLUE}, 0.7)`;
    ctx.beginPath();
    ctx.ellipse(cx, cy, r * 1.25, r * 0.35, -0.35, 0, Math.PI * 2);
    ctx.stroke();
    const scan = cy - r + ((t * 0.4) % 1) * 2 * r;

    ctx.fillStyle = `rgba(${SKY}, 0.25)`;
    ctx.fillRect(cx - Math.sqrt(Math.max(0, r * r - (scan - cy) ** 2)), scan, 2 * Math.sqrt(Math.max(0, r * r - (scan - cy) ** 2)), 1.5 * u);
    // the roses of the cities, and the name of the one facing us (one name: no overlap)
    let front = null;

    CITIES.slice(0, conquered).forEach(([name, lat, lon]) => {
        const p = point(lat, lon);

        if (p.z > 0.15) {
            const size = (12 + p.z * 8) * u;

            ctx.globalAlpha = Math.min(1, p.z * 1.5);
            drawEmote("rose", p.x - size / 2, p.y - size / 2, size);
            ctx.globalAlpha = 1;
            if (!front || p.z > front.z) {
                front = { name: name, x: p.x, y: p.y, z: p.z };
            }
        }
    });
    if (front && front.z > 0.6) {
        ctx.font = `700 ${9 * u}px ${MONO}`;
        ctx.fillStyle = "#eaf1ff";
        ctx.textAlign = "center";
        ctx.fillText(front.name, front.x, front.y - 12 * u);
        ctx.textAlign = "start";
    }
}

// =========================
// Fan chat, reactions
// =========================
function drawChat(t, dt) {
    const w = 390 * u;
    const x = wd.width - w - 44 * u;
    const y = wd.height * 0.4;
    const h = wd.height - y - 64 * u;
    const row = 54 * u;
    const top = y + 44 * u;
    const bottom = y + h - 12 * u;

    nextMessage -= dt * (1 + wd.energy * 3);
    if (nextMessage <= 0 || (wd.beat > 0.95 && random() < 0.05)) {
        const fan = FANS[Math.floor(random() * FANS.length)];
        // now and then a fan wears one of the user's emotes, or sends a super chat
        const avatar = userEmotes.length && random() < 0.4 ? userEmotes[Math.floor(random() * userEmotes.length)] : null;

        chat.push({ fan: fan, avatar: avatar, text: MESSAGES[Math.floor(random() * MESSAGES.length)], born: t,
            y: bottom, superchat: random() < 0.12 });
        nextMessage = 2 + random() * 2.4;
        if (chat.length > 9) {
            chat.shift();
        }
    }
    frame(x, y, w, h, "live chat \u00b7 #ado-fans", t, true, false, `${(39393 + Math.floor(t)).toLocaleString("en")} \u25c9`);
    ctx.save();
    ctx.beginPath();
    ctx.rect(x, top, w, bottom - top);
    ctx.clip();
    chat.forEach((message, i) => {
        const target = bottom - (chat.length - i) * row;
        const age = t - message.born;

        message.y += (target - message.y) * (1 - Math.exp(-dt * 10));
        ctx.globalAlpha = Math.min(1, age * 3) * Math.max(0, Math.min(1, (message.y - top) / (row * 0.8)));
        if (message.superchat) {
            const band = ctx.createLinearGradient(x, 0, x + w, 0);

            band.addColorStop(0, `rgba(${BLUE}, 0.55)`);
            band.addColorStop(1, `rgba(${BLUE}, 0.08)`);
            ctx.fillStyle = band;
            ctx.fillRect(x + 10 * u, message.y + 3 * u, w - 20 * u, row - 6 * u);
            ctx.font = `800 ${11 * u}px ${MONO}`;
            ctx.fillStyle = "#ffd166";
            ctx.fillText("\u00a53,939", x + w - 74 * u, message.y + 20 * u);
        }
        ctx.fillStyle = message.fan[2];
        ctx.beginPath();
        ctx.arc(x + 32 * u, message.y + row / 2, 15 * u, 0, Math.PI * 2);
        ctx.fill();
        if (message.avatar) {
            ctx.drawImage(message.avatar, x + 18 * u, message.y + row / 2 - 14 * u, 28 * u, 28 * u);
        } else {
            drawEmote(message.fan[1], x + 17 * u, message.y + row / 2 - 15 * u, 30 * u);
        }
        ctx.font = `700 ${12 * u}px ${SANS}`;
        ctx.fillStyle = message.fan[2];
        ctx.fillText(message.fan[0], x + 56 * u, message.y + 20 * u);
        ctx.font = `${13 * u}px ${SANS}`;
        ctx.fillStyle = "#eaf1ff";
        richText(message.text, x + 56 * u, message.y + 40 * u, 20 * u, w - 76 * u);
        ctx.globalAlpha = 1;
    });
    ctx.restore();
    // reactions rise from the top of the chat, over the rose
    if ((wd.beat > 0.9 && random() < 0.3) || random() < dt * 0.6) {
        reactions.push({ x: x + w - 40 * u - random() * 200 * u, y: y - 6 * u,
            emote: REACTIONS[Math.floor(random() * REACTIONS.length)], born: t, speed: (70 + random() * 60) * u,
            image: userEmotes.length && random() < 0.35 ? userEmotes[Math.floor(random() * userEmotes.length)] : null,
            phase: random() * 6.28 });
    }
    for (let i = reactions.length - 1; i >= 0; i--) {
        const r = reactions[i];
        const age = t - r.born;

        if (age > 3) {
            reactions.splice(i, 1);
            continue;
        }
        ctx.globalAlpha = Math.min(1, (3 - age) * 0.8);
        const size = (26 + age * 8) * u;
        const rx = r.x + Math.sin(age * 3 + r.phase) * 12 * u;
        const ry = r.y - age * r.speed - size;

        if (r.image && r.image.complete && r.image.naturalWidth) {
            ctx.drawImage(r.image, rx, ry, size, size);
        } else {
            drawEmote(r.emote, rx, ry, size);
        }
        ctx.globalAlpha = 1;
    }
}

// =========================
// Radio
// =========================
function drawRadio(t, dt) {
    const p = panel;
    const on = radio.playing() && !wd.radio.paused;
    const r = 56 * u;
    const cx = p.x + 30 * u + r;
    const cy = p.y + p.h / 2 + 4 * u;

    frame(p.x, p.y, p.w, p.h, "", t, false, wd.hit(p));
    // the record turns at 33 rpm while it plays
    disc += dt * (on ? 3.46 : 0);
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(disc);
    ctx.fillStyle = "#07070c";
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "rgba(255, 255, 255, 0.06)";
    ctx.lineWidth = 1;
    for (let groove = r * 0.42; groove < r * 0.97; groove += 3.5 * u) {
        ctx.beginPath();
        ctx.arc(0, 0, groove, 0, Math.PI * 2);
        ctx.stroke();
    }
    ctx.strokeStyle = `rgba(${SKY}, 0.25)`;
    ctx.lineWidth = 3 * u;
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.75, -0.4, 0.3);
    ctx.stroke();
    const label = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 0.38);

    label.addColorStop(0, `rgb(${SKY})`);
    label.addColorStop(1, `rgb(${BLUE})`);
    ctx.fillStyle = label;
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.38, 0, Math.PI * 2);
    ctx.fill();
    drawEmote("rose", -r * 0.3, -r * 0.3, r * 0.6);
    ctx.restore();
    // the arm: pivot at the top right of the record, off the record at rest, on the outer grooves while it plays
    arm += ((on ? 0.3 : -0.06) - arm) * (1 - Math.exp(-dt * 4));
    ctx.save();
    ctx.translate(cx + r * 1.05, cy - r * 0.95);
    ctx.rotate(arm);
    ctx.strokeStyle = "#c9d6f2";
    ctx.lineWidth = 3 * u;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(0, r * 1.2);
    ctx.lineTo(-r * 0.12, r * 1.36);
    ctx.stroke();
    ctx.fillStyle = "#c9d6f2";
    ctx.fillRect(-r * 0.2, r * 1.3, r * 0.16, r * 0.1);
    ctx.beginPath();
    ctx.arc(0, 0, 6 * u, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    const x = p.x + 196 * u;

    ctx.font = `700 ${12 * u}px ${MONO}`;
    ctx.fillStyle = `rgba(${SKY}, 0.85)`;
    ctx.fillText("ADO RADIO", x, p.y + 30 * u);
    drawEmote("rose", x + ctx.measureText("ADO RADIO").width + 8 * u, p.y + 15 * u, 18 * u);
    ctx.font = `600 ${15 * u}px ${JP}`;
    ctx.fillStyle = "#eaf1ff";
    radio.dot(ctx, x + 4.5 * u, p.y + 52 * u, 4.5 * u, t);
    wd.marquee(ctx, radio.title(), x + 15 * u, p.y + 57 * u, p.w - 231 * u, t);
    ctx.font = `${12 * u}px ${MONO}`;
    ctx.fillStyle = on ? `rgb(${RED})` : `rgba(${SKY}, 0.7)`;
    ctx.fillText(radio.status(), x, p.y + 79 * u);
    wd.cursor(radio.rects.some(wd.hit));
    radio.buttons(ctx, x, p.y + 96 * u, 14 * u, {
        accent: `rgb(${BLUE})`, onAccent: "#eaf1ff", button: "rgba(255, 255, 255, 0.08)", hover: `rgba(${SKY}, 0.3)`,
        icon: "#eaf1ff",
    });
}

// =========================
// Lock: the HUD of the page in the middle (ADO // PROTOCOL, 世界征服 down its side, WORLD DOMINATION: the part of the
// year done), her live stage going on behind, blue roses for the password, うっせぇわ when it is wrong
// =========================
function hudCorner(g, x, y, dx, dy, size) {
    g.beginPath();
    g.moveTo(x, y + dy * size);
    g.lineTo(x, y);
    g.lineTo(x + dx * size, y);
    g.stroke();
}

wd.lockDraw = (g, t, lock) => {
    const w = wd.width;
    const h = wd.height;
    const pw = 640 * u;
    const ph = 420 * u;
    const x = w / 2 - pw / 2 + lock.shake();
    const y = h / 2 - ph / 2;
    const failed = lock.failedAt > 0 && performance.now() - lock.failedAt < 2500;
    const now = new Date();
    const start = new Date(now.getFullYear(), 0, 1);
    const year = (now - start) / (new Date(now.getFullYear() + 1, 0, 1) - start);

    g.fillStyle = "rgba(3, 5, 14, 0.42)";
    g.fillRect(0, 0, w, h);
    // a blue light around the panel (rings, never shadowBlur)
    for (let i = 1; i <= 4; i++) {
        g.strokeStyle = `rgba(${BLUE}, ${0.12 / i})`;
        g.lineWidth = 6 * u;
        g.strokeRect(x - i * 5 * u, y - i * 5 * u, pw + i * 10 * u, ph + i * 10 * u);
    }
    g.fillStyle = "rgba(5, 8, 20, 0.84)";
    g.fillRect(x, y, pw, ph);
    g.strokeStyle = `rgba(${BLUE}, 0.5)`;
    g.lineWidth = 1;
    g.strokeRect(x + 0.5, y + 0.5, pw, ph);
    g.strokeStyle = `rgb(${SKY})`;
    g.lineWidth = 3 * u;
    hudCorner(g, x, y, 1, 1, 34 * u);
    hudCorner(g, x + pw, y + ph, -1, -1, 34 * u);
    // a scan line going down the panel
    g.fillStyle = `rgba(${BLUE}, 0.12)`;
    g.fillRect(x, y + (t * 0.25 % 1) * ph, pw, 2 * u);
    g.textAlign = "start";
    g.fillStyle = `rgba(${SKY}, 0.85)`;
    g.font = `700 ${Math.round(13 * u)}px ${MONO}`;
    g.fillText("ADO // PROTOCOL", x + 30 * u, y + 36 * u);
    g.textAlign = "end";
    g.fillStyle = `rgba(${RED}, ${0.6 + 0.4 * Math.sin(t * 4)})`;
    g.fillText("\u25cf", x + pw - 100 * u, y + 36 * u);
    g.fillStyle = `rgba(${SKY}, 0.85)`;
    g.fillText("LOCKED", x + pw - 30 * u, y + 36 * u);
    // 世界征服 down the side
    g.textAlign = "center";
    g.fillStyle = "#eaf1ff";
    g.font = `900 ${Math.round(38 * u)}px ${JP}`;
    "世界征服".split("").forEach((c, i) => g.fillText(c, x + 62 * u, y + 120 * u + i * 62 * u));
    const mid = x + pw / 2 + 40 * u;

    g.font = `italic 900 ${Math.round(96 * u)}px ${SANS}`;
    wd.glowText(g, now.toTimeString().slice(0, 5), mid, y + 160 * u, `rgb(${BLUE})`, 10 * u);
    g.fillStyle = "#eaf1ff";
    g.fillText(now.toTimeString().slice(0, 5), mid, y + 160 * u);
    g.font = `italic 700 ${Math.round(15 * u)}px ${MONO}`;
    g.fillText(`WORLD DOMINATION  ${(year * 100).toFixed(1)}%`, mid, y + 200 * u);
    const cells = 24;

    for (let i = 0; i < cells; i++) {
        const lit = i / cells < year;

        g.fillStyle = lit ? `rgba(${BLUE}, ${0.75 + 0.25 * wd.levels[i * 2 % 48]})` : `rgba(${SKY}, 0.18)`;
        g.fillRect(mid - 150 * u + i * 12.5 * u, y + 214 * u, 10 * u, 10 * u);
    }
    // the password: a blue rose a letter
    const fw = 380 * u;
    const fh = 56 * u;
    const fx = mid - fw / 2;
    const fy = y + 252 * u;
    const edge = g.createLinearGradient(fx, 0, fx + fw, 0);

    edge.addColorStop(0, failed ? `rgb(${RED})` : `rgb(${BLUE})`);
    edge.addColorStop(1, failed ? `rgb(${RED})` : `rgb(${SKY})`);
    g.fillStyle = "rgba(11, 20, 48, 0.95)";
    g.fillRect(fx, fy, fw, fh);
    g.strokeStyle = edge;
    g.lineWidth = 2 * u;
    g.strokeRect(fx, fy, fw, fh);
    if (lock.typed.length) {
        const count = lock.typed.length;
        const size = 30 * u;
        const step = Math.min(size + 4 * u, (fw - 30 * u) / count);

        for (let i = 0; i < count; i++) {
            const turn = Math.sin(t * 3 + i) * 0.15;
            const cx = mid + (i - (count - 1) / 2) * step;

            g.save();
            g.translate(cx, fy + fh / 2);
            g.rotate(turn);
            if (EMOTES.rose) {
                g.drawImage(EMOTES.rose, -size / 2, -size / 2, size, size);
            }
            g.restore();
        }
    } else {
        g.fillStyle = failed ? `rgb(${RED})` : `rgba(${SKY}, 0.75)`;
        g.font = `${failed ? "900 " : ""}${Math.round(17 * u)}px ${JP}`;
        g.fillText(lock.busy ? "\u2026" : (failed ? "うっせぇわ!!" : "Password"), mid, fy + fh / 2 + 6 * u);
    }
    g.fillStyle = `rgba(${SKY}, 0.7)`;
    g.font = `${Math.round(12 * u)}px ${MONO}`;
    g.fillText(`${now.getFullYear()}.${String(now.getMonth() + 1).padStart(2, "0")}.${String(now.getDate()).padStart(2, "0")}  `
        + now.toLocaleDateString("en-GB", { weekday: "short" }).toUpperCase(), mid, fy + fh + 34 * u);
    if (wd.radio.playing && wd.radio.title) {
        g.fillStyle = "#eaf1ff";
        g.font = `${Math.round(14 * u)}px ${JP}`;
        g.fillText(`ADO RADIO  \u266a  ${wd.radio.title}`, w / 2, h - 60 * u);
    }
    g.textAlign = "start";
};

wd.run((t, dt) => {
    drawRose(t);
    drawTitle(t);
    drawCage(t);
    drawPetals(t, dt);
    drawDomination(t);
    drawChat(t, dt);
    drawRadio(t, dt);
});
</script>
</body>
</html>
