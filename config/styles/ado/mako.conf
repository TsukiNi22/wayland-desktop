# wayland-desktop style: Ado / blue rose - mako notifications
font=Adwaita Sans 11
background-color=#0b1430f0
text-color=#eaf1ff
border-color=#2f6bff
progress-color=over #2f6bff55
border-size=2
border-radius=18
padding=14,18
margin=10
outer-margin=6,4,0,0
width=380
max-visible=4
default-timeout=4500
icons=1
max-icon-size=40
format=<b>%s</b>\n%b
anchor=top-right
layer=overlay

[app-name=wd-style]
border-size=3
default-timeout=2500

[urgency=low]
border-color=#223a7a

[urgency=high]
border-color=#ff2a4a
default-timeout=0

[mode=do-not-disturb]
invisible=1
