# wayland-desktop style: Ado / blue rose - hyprlock (lock screen, inspired by the jpop POC); @DIR@ = folder of the style

general {
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    path = @DIR@/wallpaper.jpg
    color = rgb(050814)
    blur_passes = 2
    brightness = 0.6
}

label {
    monitor =
    text = $TIME
    font_size = 120
    font_family = Noto Sans CJK JP
    color = rgb(eaf1ff)
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = 夢かなう · wishes come true
    font_size = 18
    font_family = Noto Sans CJK JP
    color = rgb(2f6bff)
    position = 0, 40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 3
    rounding = -1
    outer_color = rgb(2f6bff)
    inner_color = rgb(0b1430)
    font_color = rgb(eaf1ff)
    check_color = rgb(9fc3ff)
    fail_color = rgb(ff2a4a)
    placeholder_text = <i>Password</i>
    dots_text_format = 🌹
    dots_size = 0.4
    fade_on_empty = false
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:2000] playerctl metadata --format '♪  {{ title }}  ·  {{ artist }}' 2> /dev/null
    font_size = 14
    font_family = Adwaita Sans
    color = rgb(8ea3cc)
    position = 0, 60
    halign = center
    valign = bottom
}
