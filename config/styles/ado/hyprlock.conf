# wayland-desktop style: Ado / blue rose - hyprlock (lock screen, inspired by the jpop POC); @DIR@ = folder of the style
# The session behind it (its windows, a little darker), the HUD of the page in the middle: ADO // PROTOCOL, 世界征服
# down its side, the clock, WORLD DOMINATION (the part of the year done), the password with blue flowers for dots, the
# ADO RADIO at the bottom

general {
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    color = rgb(050814)
    blur_passes = 0
    brightness = 0.68
}

# the panel of the HUD and its four corners
shape {
    monitor =
    size = 600, 400
    color = rgba(5, 8, 20, 0.8)
    rounding = 6
    border_size = 1
    border_color = rgba(47, 107, 255, 0.55)
    shadow_passes = 2
    shadow_size = 12
    shadow_color = rgba(47, 107, 255, 0.3)
    position = 0, 0
    halign = center
    valign = center
}

shape {
    monitor =
    size = 40, 3
    color = rgb(5b8cff)
    position = -286, 199
    halign = center
    valign = center
}

shape {
    monitor =
    size = 3, 40
    color = rgb(5b8cff)
    position = -299, 186
    halign = center
    valign = center
}

shape {
    monitor =
    size = 40, 3
    color = rgb(5b8cff)
    position = 286, -199
    halign = center
    valign = center
}

shape {
    monitor =
    size = 3, 40
    color = rgb(5b8cff)
    position = 299, -186
    halign = center
    valign = center
}

label {
    monitor =
    text = <b>ADO // PROTOCOL</b>
    font_size = 12
    font_family = JetBrains Mono
    color = rgb(8ea3cc)
    position = -170, 170
    halign = center
    valign = center
}

label {
    monitor =
    text = <span foreground="##ff2a4a">●</span> LOCKED
    font_size = 12
    font_family = JetBrains Mono
    color = rgb(8ea3cc)
    position = 230, 170
    halign = center
    valign = center
}

# 世界征服 down the side
label {
    monitor =
    text = <b>世<br/>界<br/>征<br/>服</b>
    font_size = 30
    font_family = Noto Sans CJK JP
    color = rgb(eaf1ff)
    text_align = center
    position = -245, 10
    halign = center
    valign = center
}

label {
    monitor =
    text = <b><i>$TIME</i></b>
    font_size = 80
    font_family = Noto Sans CJK JP
    color = rgb(eaf1ff)
    shadow_passes = 3
    shadow_size = 7
    shadow_color = rgba(47, 107, 255, 0.85)
    position = 30, 85
    halign = center
    valign = center
}

# WORLD DOMINATION: the part of the year done, a bar of squares
label {
    monitor =
    text = cmd[update:60000] p=$(( $(date +%-j) * 1000 / 366 )); n=$(( p / 50 )); bar=""; for i in $(seq 1 20); do [ "$i" -le "$n" ] && bar="$bar■" || bar="$bar□"; done; echo "<b><i>WORLD DOMINATION</i></b>  $((p / 10)).$((p % 10))%<br/><span foreground='##2f6bff'>$bar</span>"
    font_size = 13
    font_family = JetBrains Mono
    color = rgb(eaf1ff)
    text_align = center
    position = 30, 0
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 360, 52
    outline_thickness = 2
    rounding = 4
    outer_color = rgba(47, 107, 255, 1.0) rgba(150, 190, 255, 1.0) 45deg
    inner_color = rgba(11, 20, 48, 0.95)
    font_color = rgb(5b8cff)
    font_family = Noto Sans Symbols 2
    check_color = rgb(9fc3ff)
    fail_color = rgb(ff2a4a)
    fail_text = <i>うっせぇわ ($ATTEMPTS)</i>
    placeholder_text = <span foreground="##8ea3cc">Password</span>
    dots_text_format = ✿
    dots_size = 0.45
    fade_on_empty = false
    position = 30, -100
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%Y.%m.%d  %a" | tr '[:lower:]' '[:upper:]'
    font_size = 11
    font_family = JetBrains Mono
    color = rgb(8ea3cc)
    position = 30, -160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:2000] t=$(playerctl metadata title 2> /dev/null) && echo "<b>ADO RADIO</b>   $t  ·  $(playerctl metadata artist 2> /dev/null)"
    font_size = 14
    font_family = Noto Sans CJK JP
    color = rgb(eaf1ff)
    shadow_passes = 2
    shadow_color = rgba(0, 0, 0, 0.8)
    position = 0, 60
    halign = center
    valign = bottom
}
