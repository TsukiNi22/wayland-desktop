<!doctype html>
<!-- wayland-desktop style: System - live wallpaper (wd-wallpaper): drifting aurora, a 3D sphere of points that the
     music pushes out, a perspective grid, a glowing waveform and a light clock -->
<html>
<head>
<meta charset="utf-8">
<style>
    html { background: transparent; }
    body { margin: 0; height: 100vh; overflow: hidden; background: #0e1217; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<canvas id="main"></canvas>
<script src="../../common/wallpaper/wd.js"></script>
<script>
"use strict";

// the small radio of wd.js, fitted into this page (Super+Shift+M or wd-style radio hide: hidden)
wd.radioLook = { layout: "card", panel: "rgba(14, 18, 23, 0.62)", border: "rgba(90, 169, 255, 0.32)", fg: "#d6dde7",
    muted: "#7b8798", accent: "#5aa9ff", onAccent: "#0e1217", corner: 18, title: "radio",
    place: () => ({ x: wd.width * 0.09, y: wd.height * 0.555, w: 470 }) };

const ctx = wd.canvas("main");
const POINTS = 1100;
const sphere = [];
const random = wd.rand(7);
const blobs = [
    { color: [90, 169, 255], x: 0.25, y: 0.3, r: 0.55, speed: 0.05, phase: 0 },
    { color: [95, 211, 141], x: 0.75, y: 0.75, r: 0.5, speed: 0.04, phase: 2 },
    { color: [180, 140, 255], x: 0.6, y: 0.2, r: 0.4, speed: 0.06, phase: 4 },
];

// points of a Fibonacci sphere, each one listening to a band of the spectrum
for (let i = 0; i < POINTS; i++) {
    const y = 1 - (i / (POINTS - 1)) * 2;
    const radius = Math.sqrt(1 - y * y);
    const theta = i * 2.399963;

    sphere.push({ x: Math.cos(theta) * radius, y: y, z: Math.sin(theta) * radius, band: Math.floor((y + 1) / 2 * 47.99),
        jitter: random() });
}

function drawAurora(t) {
    const w = wd.width;
    const h = wd.height;
    const background = ctx.createLinearGradient(0, 0, 0, h);

    background.addColorStop(0, "#111821");
    background.addColorStop(1, "#090c11");
    ctx.fillStyle = background;
    ctx.fillRect(0, 0, w, h);
    ctx.globalCompositeOperation = "lighter";
    for (const blob of blobs) {
        const x = (blob.x + 0.12 * Math.sin(t * blob.speed + blob.phase)) * w;
        const y = (blob.y + 0.1 * Math.cos(t * blob.speed * 1.3 + blob.phase)) * h;
        const glow = ctx.createRadialGradient(x, y, 0, x, y, blob.r * h * (1 + wd.bass * 0.25));
        const [r, g, b] = blob.color;

        glow.addColorStop(0, `rgba(${r}, ${g}, ${b}, ${0.13 + wd.mid * 0.12})`);
        glow.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, w, h);
    }
    ctx.globalCompositeOperation = "source-over";
}

function drawGrid(t) {
    const w = wd.width;
    const h = wd.height;
    const horizon = h * 0.62;
    const fade = ctx.createLinearGradient(0, horizon, 0, h);

    // the lines fade in from the horizon
    fade.addColorStop(0, "rgba(90, 169, 255, 0)");
    fade.addColorStop(1, "rgba(90, 169, 255, 0.16)");
    ctx.strokeStyle = fade;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = -24; i <= 24; i++) {
        ctx.moveTo(w / 2 + i * 12, horizon);
        ctx.lineTo(w / 2 + i * w * 0.09, h);
    }
    for (let i = 0; i < 14; i++) {
        const k = ((i + (t * 0.35) % 1) / 14) ** 2.2;
        const y = horizon + (h - horizon) * k;

        ctx.moveTo(0, y);
        ctx.lineTo(w, y);
    }
    ctx.stroke();
}

function drawSphere(t) {
    const cx = wd.width * 0.7;
    const cy = wd.height * 0.44;
    const size = wd.height * 0.23 * (1 + wd.beat * 0.05);
    const ay = t * 0.25;
    const ax = 0.35 + Math.sin(t * 0.13) * 0.2;
    const [cY, sY, cX, sX] = [Math.cos(ay), Math.sin(ay), Math.cos(ax), Math.sin(ax)];
    const projected = [];

    for (const p of sphere) {
        const push = 1 + wd.levels[p.band] * 0.55 + 0.02 * Math.sin(t * 2 + p.jitter * 6);
        const x = p.x * cY - p.z * sY;
        const z1 = p.x * sY + p.z * cY;
        const y = p.y * cX - z1 * sX;
        const z = p.y * sX + z1 * cX;
        const scale = 2.6 / (2.6 + z);

        projected.push({ x: cx + x * size * push * scale, y: cy + y * size * push * scale, z: z, level: wd.levels[p.band] });
    }
    projected.sort((a, b) => b.z - a.z);
    for (const p of projected) {
        const depth = (1 - p.z) / 2;
        const mix = Math.min(1, p.level * 1.6);
        const r = Math.round(90 + (95 - 90) * mix);
        const g = Math.round(169 + (211 - 169) * mix);
        const b = Math.round(255 + (141 - 255) * mix);

        const size = 1.2 + depth * 3 + p.level * 2.5;

        ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${0.18 + depth * 0.75})`;
        ctx.fillRect(p.x - size / 2, p.y - size / 2, size, size);
    }
    // halo
    const halo = ctx.createRadialGradient(cx, cy, size * 0.6, cx, cy, size * 1.9);

    halo.addColorStop(0, `rgba(90, 169, 255, ${0.06 + wd.beat * 0.08})`);
    halo.addColorStop(1, "rgba(90, 169, 255, 0)");
    ctx.fillStyle = halo;
    ctx.fillRect(cx - size * 2, cy - size * 2, size * 4, size * 4);
}

function drawWave(t) {
    const w = wd.width;
    const base = wd.height * 0.8;
    const amplitude = wd.height * 0.07;

    ctx.save();
    ctx.shadowColor = "rgba(90, 169, 255, 0.9)";
    ctx.shadowBlur = 14;
    for (const [sign, color] of [[1, "rgba(90, 169, 255, 0.75)"], [-1, "rgba(95, 211, 141, 0.45)"]]) {
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (let x = 0; x <= w; x += 8) {
            const position = x / w * (wd.bars - 1);
            const i = Math.floor(position);
            const level = wd.levels[i] + (wd.levels[Math.min(wd.bars - 1, i + 1)] - wd.levels[i]) * (position - i);
            const envelope = Math.sin(Math.PI * x / w);
            const y = base - sign * (level * amplitude + 3 * Math.sin(t * 1.5 + x * 0.01)) * envelope;

            if (x === 0) {
                ctx.moveTo(x, y);
            } else {
                ctx.lineTo(x, y);
            }
        }
        ctx.stroke();
    }
    ctx.restore();
}

function drawClock() {
    const now = new Date();

    // a still wallpaper keeps no clock (hyprlock draws its own), nor the lock (its clock is in the middle)
    if (wd.still !== null || wd.lock.on) {
        return;
    }
    const x = wd.width * 0.09;
    const y = wd.height * 0.42;

    ctx.fillStyle = "#d6dde7";
    ctx.font = `200 ${Math.round(wd.height * 0.15)}px "Adwaita Sans", "Inter", sans-serif`;
    ctx.textBaseline = "alphabetic";
    ctx.fillText(now.toTimeString().slice(0, 5), x, y);
    ctx.fillStyle = "#5aa9ff";
    ctx.font = `500 ${Math.round(wd.height * 0.026)}px "Adwaita Sans", "Inter", sans-serif`;
    ctx.fillText(now.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" }), x + 6, y + wd.height * 0.05);
    ctx.fillStyle = "rgba(123, 135, 152, 0.9)";
    ctx.font = `400 ${Math.round(wd.height * 0.017)}px "JetBrains Mono", monospace`;
    ctx.fillText(`${wd.user}@${wd.host}  ·  ${wd.info.os}`, x + 6, y + wd.height * 0.09);
}

// =========================
// Lock: a light clock, the user in a ring of the music, a password of glass, the state of the machine in chips
// =========================
const face = new Image();

wd.lockInfo = lock => {
    if (lock.info.face && face.src !== lock.info.face) {
        face.src = lock.info.face;
    }
};

function chip(g, text, x, y, color) {
    g.font = '13px "JetBrains Mono", monospace';
    const w = g.measureText(text).width + 30;

    g.fillStyle = "rgba(14, 18, 23, 0.6)";
    g.strokeStyle = "rgba(90, 169, 255, 0.28)";
    g.lineWidth = 1;
    g.beginPath();
    g.roundRect(x - w / 2, y - 15, w, 30, 15);
    g.fill();
    g.stroke();
    g.fillStyle = color;
    g.textAlign = "center";
    g.fillText(text, x, y + 4.5);
    return w;
}

wd.lockDraw = (g, t, lock) => {
    const w = wd.width;
    const h = wd.height;
    const cx = w / 2;
    const now = new Date();
    const facts = lock.info.facts || {};
    const veil = g.createRadialGradient(cx, h / 2, h * 0.2, cx, h / 2, h * 0.95);

    veil.addColorStop(0, "rgba(9, 12, 17, 0.25)");
    veil.addColorStop(1, "rgba(9, 12, 17, 0.75)");
    g.fillStyle = veil;
    g.fillRect(0, 0, w, h);
    g.textAlign = "center";
    g.fillStyle = "#d6dde7";
    g.font = `200 ${Math.round(h * 0.12)}px "Adwaita Sans", "Inter", sans-serif`;
    g.fillText(now.toTimeString().slice(0, 5), cx, h * 0.25);
    g.fillStyle = "#5aa9ff";
    g.font = `500 ${Math.round(h * 0.022)}px "Adwaita Sans", sans-serif`;
    g.fillText(now.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" }), cx, h * 0.25 + h * 0.05);

    // the user, in a ring of the music turning around
    const ay = h * 0.47;
    const r = h * 0.07;

    g.save();
    g.translate(cx, ay);
    g.rotate(t * 0.15);
    for (let i = 0; i < 96; i++) {
        const level = wd.levels[i % 48];
        const a = i / 96 * Math.PI * 2;
        const length = 4 + level * h * 0.045;
        const k = (Math.sin(a) + 1) / 2;

        g.strokeStyle = `rgba(${Math.round(90 + 5 * k)}, ${Math.round(169 + 42 * k)}, ${Math.round(255 - 114 * k)}, ${0.45 + level * 0.55})`;
        g.lineWidth = 3;
        g.beginPath();
        g.moveTo(Math.cos(a) * (r + 10), Math.sin(a) * (r + 10));
        g.lineTo(Math.cos(a) * (r + 10 + length), Math.sin(a) * (r + 10 + length));
        g.stroke();
    }
    // a satellite on its orbit
    g.rotate(t * 0.6);
    g.strokeStyle = "rgba(90, 169, 255, 0.25)";
    g.lineWidth = 1;
    g.beginPath();
    g.arc(0, 0, r + h * 0.07, 0, Math.PI * 2);
    g.stroke();
    g.fillStyle = "#5fd38d";
    g.beginPath();
    g.arc(r + h * 0.07, 0, 4, 0, Math.PI * 2);
    g.fill();
    g.restore();
    g.save();
    g.beginPath();
    g.arc(cx, ay, r, 0, Math.PI * 2);
    g.clip();
    if (face.complete && face.naturalWidth) {
        g.drawImage(face, cx - r, ay - r, r * 2, r * 2);
    } else {
        const ground = g.createLinearGradient(cx - r, ay - r, cx + r, ay + r);

        ground.addColorStop(0, "#5aa9ff");
        ground.addColorStop(1, "#5fd38d");
        g.fillStyle = ground;
        g.fillRect(cx - r, ay - r, r * 2, r * 2);
        g.fillStyle = "#0e1217";
        g.font = `600 ${Math.round(r)}px "Adwaita Sans", sans-serif`;
        g.fillText((lock.info.user || wd.user || "?")[0].toUpperCase(), cx, ay + r * 0.36);
    }
    g.restore();
    g.fillStyle = "#d6dde7";
    g.font = `600 ${Math.round(h * 0.024)}px "Adwaita Sans", sans-serif`;
    g.fillText(lock.info.user || wd.user, cx, ay + r + h * 0.085);

    // the password of glass: its dots light up, a light runs over it while PAM checks
    const fw = 380;
    const fh = 52;
    const fx = cx - fw / 2 + lock.shake();
    const fy = h * 0.66;
    const failed = lock.failedAt > 0 && performance.now() - lock.failedAt < 2500;
    const ring = g.createLinearGradient(fx, fy, fx + fw, fy + fh);

    ring.addColorStop(0, failed ? "#ff6b6b" : "#5aa9ff");
    ring.addColorStop(1, failed ? "#ff6b6b" : "#5fd38d");
    g.fillStyle = "rgba(14, 18, 23, 0.72)";
    g.strokeStyle = ring;
    g.lineWidth = 2;
    g.beginPath();
    g.roundRect(fx, fy, fw, fh, fh / 2);
    g.fill();
    g.stroke();
    if (lock.busy) {
        const k = (t * 1.4) % 1;
        const shine = g.createLinearGradient(fx + fw * (k - 0.3), 0, fx + fw * k, 0);

        shine.addColorStop(0, "rgba(90, 169, 255, 0)");
        shine.addColorStop(1, "rgba(90, 169, 255, 0.35)");
        g.fillStyle = shine;
        g.beginPath();
        g.roundRect(fx, fy, fw, fh, fh / 2);
        g.fill();
    }
    const count = lock.typed.length;

    if (count) {
        const step = Math.min(22, (fw - 60) / count);

        for (let i = 0; i < count; i++) {
            const x = cx + lock.shake() + (i - (count - 1) / 2) * step;
            const k = i / Math.max(1, count - 1);

            g.fillStyle = `rgb(${Math.round(90 + 5 * k)}, ${Math.round(169 + 42 * k)}, ${Math.round(255 - 114 * k)})`;
            g.beginPath();
            g.arc(x, fy + fh / 2, 5.5, 0, Math.PI * 2);
            g.fill();
        }
    } else {
        g.fillStyle = failed ? "#ff6b6b" : "#7b8798";
        g.font = `${Math.round(h * 0.018)}px "Adwaita Sans", sans-serif`;
        g.fillText(lock.busy ? "checking\u2026" : (failed ? "Wrong password" : "Password"), cx + lock.shake(), fy + fh / 2 + 6);
    }

    // the machine: battery, the radio, who and where
    const chips = [];
    const battery = (facts.Battery || [])[0];

    if (battery) {
        chips.push([`\u26a1 ${Math.round(battery.capacity)}%`, battery.capacity < 20 ? "#ff6b6b" : "#5fd38d"]);
    }
    if (wd.radio.playing && wd.radio.title) {
        chips.push([`\u266a ${wd.radio.title.length > 40 ? wd.radio.title.slice(0, 39) + "\u2026" : wd.radio.title}`, "#d6dde7"]);
    }
    chips.push([`${lock.info.user || wd.user}@${lock.info.host || wd.host}`, "#7b8798"]);
    chips.push([`locked at ${lock.since}`, "#7b8798"]);
    g.font = '13px "JetBrains Mono", monospace';
    const widths = chips.map(([text]) => g.measureText(text).width + 30);
    let x = cx - (widths.reduce((a, b) => a + b, 0) + 12 * (chips.length - 1)) / 2;

    chips.forEach(([text, color], i) => {
        chip(g, text, x + widths[i] / 2, h * 0.9, color);
        x += widths[i] + 12;
    });
    g.textAlign = "start";
};

wd.run((t, dt) => {
    drawAurora(t);
    drawGrid(t);
    drawWave(t);
    drawSphere(t);
    drawClock();
});
</script>
</body>
</html>
