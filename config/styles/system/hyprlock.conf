# wayland-desktop style: System - hyprlock (lock screen, inspired by the system POC); @DIR@ = folder of the style

general {
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    path = @DIR@/wallpaper.jpg
    color = rgb(0e1217)
    blur_passes = 2
    brightness = 0.6
}

label {
    monitor =
    text = $TIME
    font_size = 120
    font_family = Adwaita Sans
    color = rgb(d6dde7)
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = Any password unlocks
    font_size = 18
    font_family = Adwaita Sans
    color = rgb(5aa9ff)
    position = 0, 40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    rounding = -1
    outer_color = rgb(5aa9ff)
    inner_color = rgb(151b23)
    font_color = rgb(d6dde7)
    check_color = rgb(5fd38d)
    fail_color = rgb(ff6b6b)
    placeholder_text = <i>Password</i>
    fade_on_empty = false
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:2000] playerctl metadata --format '♪  {{ title }}  ·  {{ artist }}' 2> /dev/null
    font_size = 14
    font_family = Adwaita Sans
    color = rgb(7b8798)
    position = 0, 60
    halign = center
    valign = bottom
}
