# wayland-desktop style: System - hyprlock (lock screen, inspired by the system POC); @DIR@ = folder of the style
# The session behind it (its windows, a little darker), a card of glass in the middle: the light clock, the date, who
# is locked, the password in a blue to green ring, the battery and the network under it, the music at the bottom

general {
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    color = rgb(0e1217)
    blur_passes = 0
    brightness = 0.72
}

# the card of glass
shape {
    monitor =
    size = 470, 430
    color = rgba(14, 18, 23, 0.66)
    rounding = 24
    border_size = 1
    border_color = rgba(90, 169, 255, 0.4)
    shadow_passes = 2
    shadow_size = 10
    shadow_color = rgba(0, 0, 0, 0.55)
    position = 0, 10
    halign = center
    valign = center
}

# a line of light on its top
shape {
    monitor =
    size = 120, 3
    color = rgba(90, 169, 255, 0.9)
    rounding = 2
    position = 0, 224
    halign = center
    valign = center
}

label {
    monitor =
    text = <span font_weight="200">$TIME</span>
    font_size = 92
    font_family = Adwaita Sans
    color = rgb(d6dde7)
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A %-d %B"
    font_size = 17
    font_family = Adwaita Sans
    color = rgb(5aa9ff)
    position = 0, 40
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:0] echo "$USER@$(hostname -s)"
    font_size = 12
    font_family = JetBrains Mono
    color = rgb(7b8798)
    position = 0, 8
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 340, 50
    outline_thickness = 2
    rounding = 14
    outer_color = rgba(90, 169, 255, 0.95) rgba(95, 211, 141, 0.95) 45deg
    inner_color = rgba(21, 27, 35, 0.92)
    font_color = rgb(d6dde7)
    check_color = rgb(5fd38d)
    fail_color = rgb(ff6b6b)
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    placeholder_text = <span foreground="##7b8798">Password</span>
    dots_size = 0.26
    dots_spacing = 0.35
    fade_on_empty = false
    position = 0, -60
    halign = center
    valign = center
}

# the battery and the network, like the bar of the session
label {
    monitor =
    text = cmd[update:5000] b=$(cat /sys/class/power_supply/BAT*/capacity 2> /dev/null | head -n 1); n=$(nmcli -t -f NAME connection show --active 2> /dev/null | head -n 1); echo "${b:+⚡ $b%}${b:+${n:+   ·   }}${n:+  $n}"
    font_size = 12
    font_family = JetBrains Mono
    color = rgb(7b8798)
    position = 0, -150
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:2000] t=$(playerctl metadata title 2> /dev/null) && echo "♪  $t  ·  $(playerctl metadata artist 2> /dev/null)"
    font_size = 14
    font_family = Adwaita Sans
    color = rgb(d6dde7)
    shadow_passes = 2
    shadow_color = rgba(0, 0, 0, 0.8)
    position = 0, 60
    halign = center
    valign = bottom
}
