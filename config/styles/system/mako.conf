# wayland-desktop style: System - mako notifications
font=Adwaita Sans 11
background-color=#151b23f0
text-color=#d6dde7
border-color=#5aa9ff
progress-color=over #5aa9ff55
border-size=2
border-radius=14
padding=14,18
margin=10
outer-margin=6,4,0,0
width=380
max-visible=4
default-timeout=4500
icons=1
max-icon-size=40
format=<b>%s</b>\n%b
anchor=top-right
layer=overlay

[app-name=wd-style]
border-size=3
default-timeout=2500

[urgency=low]
border-color=#2a3441

[urgency=high]
border-color=#ff6b6b
default-timeout=0

[mode=do-not-disturb]
invisible=1
