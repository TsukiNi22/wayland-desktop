# wayland-desktop style: Photographer - hyprlock (lock screen, inspired by the photographer POC); @DIR@ = folder of the style

general {
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    path = @DIR@/wallpaper.jpg
    color = rgb(121110)
    blur_passes = 2
    brightness = 0.6
}

label {
    monitor =
    text = $TIME
    font_size = 120
    font_family = Noto Serif
    color = rgb(ece8e1)
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = 1/250  F2.8  ISO 200  [ 999 ]
    font_size = 18
    font_family = Noto Serif
    color = rgb(d9a441)
    position = 0, 40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 1
    rounding = -1
    outer_color = rgb(d9a441)
    inner_color = rgb(1b1a18)
    font_color = rgb(ece8e1)
    check_color = rgb(9fb4d9)
    fail_color = rgb(e07a5f)
    placeholder_text = <i>Password</i>
    fade_on_empty = false
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:2000] playerctl metadata --format '♪  {{ title }}  ·  {{ artist }}' 2> /dev/null
    font_size = 14
    font_family = Noto Serif
    color = rgb(8a857c)
    position = 0, 60
    halign = center
    valign = bottom
}
