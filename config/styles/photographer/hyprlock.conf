# wayland-desktop style: Photographer - hyprlock (lock screen, inspired by the photographer POC); @DIR@ = folder of the
# style
# The session behind it (its windows, a little darker) seen through a viewfinder: its corners, REC blinking, the
# battery, the clock, AF corners around the password, the exposure line and the date printed like on film

general {
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    color = rgb(121110)
    blur_passes = 0
    brightness = 0.75
    zindex = -2
}

# the corners of the viewfinder
shape {
    monitor =
    size = 44, 2
    color = rgba(236, 232, 225, 0.8)
    position = 46, -46
    halign = left
    valign = top
}

shape {
    monitor =
    size = 2, 44
    color = rgba(236, 232, 225, 0.8)
    position = 46, -46
    halign = left
    valign = top
}

shape {
    monitor =
    size = 44, 2
    color = rgba(236, 232, 225, 0.8)
    position = -46, -46
    halign = right
    valign = top
}

shape {
    monitor =
    size = 2, 44
    color = rgba(236, 232, 225, 0.8)
    position = -46, -46
    halign = right
    valign = top
}

shape {
    monitor =
    size = 44, 2
    color = rgba(236, 232, 225, 0.8)
    position = 46, 46
    halign = left
    valign = bottom
}

shape {
    monitor =
    size = 2, 44
    color = rgba(236, 232, 225, 0.8)
    position = 46, 46
    halign = left
    valign = bottom
}

shape {
    monitor =
    size = 44, 2
    color = rgba(236, 232, 225, 0.8)
    position = -46, 46
    halign = right
    valign = bottom
}

shape {
    monitor =
    size = 2, 44
    color = rgba(236, 232, 225, 0.8)
    position = -46, 46
    halign = right
    valign = bottom
}

# REC blinking, the battery
label {
    monitor =
    text = cmd[update:1000] [ $(( $(date +%s) % 2 )) = 0 ] && echo "<span foreground='##e07a5f'>●</span> REC" || echo "<span foreground='##5a4a3a'>●</span> REC"
    font_size = 14
    font_family = JetBrains Mono
    color = rgb(ece8e1)
    shadow_passes = 2
    shadow_color = rgba(0, 0, 0, 0.8)
    position = 70, -70
    halign = left
    valign = top
}

label {
    monitor =
    text = cmd[update:10000] b=$(cat /sys/class/power_supply/BAT*/capacity 2> /dev/null | head -n 1); [ -n "$b" ] || exit 0; n=$(( (b + 24) / 25 )); bars=""; for i in 1 2 3 4; do [ "$i" -le "$n" ] && bars="$bars▮" || bars="$bars▯"; done; echo "$bars  $b%"
    font_size = 14
    font_family = JetBrains Mono
    color = rgb(ece8e1)
    shadow_passes = 2
    shadow_color = rgba(0, 0, 0, 0.8)
    position = -70, -70
    halign = right
    valign = top
}

# a dark matte behind the clock and the password, soft at its edges
shape {
    monitor =
    size = 760, 430
    color = rgba(12, 11, 10, 0.5)
    rounding = 40
    shadow_passes = 3
    shadow_size = 24
    shadow_color = rgba(12, 11, 10, 0.6)
    zindex = -1
    position = 0, 40
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 110
    font_family = Noto Serif
    color = rgb(ece8e1)
    shadow_passes = 2
    shadow_size = 5
    shadow_color = rgba(0, 0, 0, 0.7)
    position = 0, 130
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    font_size = 17
    font_family = Noto Serif
    color = rgb(d9a441)
    shadow_passes = 2
    shadow_color = rgba(0, 0, 0, 0.8)
    position = 0, 30
    halign = center
    valign = center
}

# the AF corners around the password (no frame: the field is the only box)
shape {
    monitor =
    size = 26, 2
    color = rgba(217, 164, 65, 0.95)
    position = -173, -50
    halign = center
    valign = center
}

shape {
    monitor =
    size = 2, 26
    color = rgba(217, 164, 65, 0.95)
    position = -185, -62
    halign = center
    valign = center
}

shape {
    monitor =
    size = 26, 2
    color = rgba(217, 164, 65, 0.95)
    position = 173, -50
    halign = center
    valign = center
}

shape {
    monitor =
    size = 2, 26
    color = rgba(217, 164, 65, 0.95)
    position = 185, -62
    halign = center
    valign = center
}

shape {
    monitor =
    size = 26, 2
    color = rgba(217, 164, 65, 0.95)
    position = -173, -110
    halign = center
    valign = center
}

shape {
    monitor =
    size = 2, 26
    color = rgba(217, 164, 65, 0.95)
    position = -185, -98
    halign = center
    valign = center
}

shape {
    monitor =
    size = 26, 2
    color = rgba(217, 164, 65, 0.95)
    position = 173, -110
    halign = center
    valign = center
}

shape {
    monitor =
    size = 2, 26
    color = rgba(217, 164, 65, 0.95)
    position = 185, -98
    halign = center
    valign = center
}

label {
    monitor =
    text = AF  ●
    font_size = 10
    font_family = JetBrains Mono
    color = rgb(d9a441)
    position = -168, -26
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 340, 50
    outline_thickness = 1
    rounding = 0
    outer_color = rgba(236, 232, 225, 0.6)
    inner_color = rgba(18, 17, 16, 0.85)
    font_color = rgb(ece8e1)
    check_color = rgb(9fb4d9)
    fail_color = rgb(e07a5f)
    fail_text = <i>out of focus ($ATTEMPTS)</i>
    placeholder_text = <span foreground="##8a857c"><i>Password</i></span>
    dots_size = 0.22
    dots_spacing = 0.4
    fade_on_empty = false
    position = 0, -80
    halign = center
    valign = center
}

# the exposure line, the music under it
label {
    monitor =
    text = f/1.8    1/125    ISO 200    35mm
    font_size = 13
    font_family = JetBrains Mono
    color = rgba(236, 232, 225, 0.85)
    shadow_passes = 2
    shadow_color = rgba(0, 0, 0, 0.8)
    position = 0, 100
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:2000] t=$(playerctl metadata title 2> /dev/null) && echo "♪  $t  ·  $(playerctl metadata artist 2> /dev/null)"
    font_size = 13
    font_family = Noto Serif
    color = rgb(d9a441)
    shadow_passes = 2
    shadow_color = rgba(0, 0, 0, 0.8)
    position = 0, 70
    halign = center
    valign = bottom
}

# the date printed on the film
label {
    monitor =
    text = cmd[update:60000] date +"'%y %-m %-d"
    font_size = 22
    font_family = JetBrains Mono
    color = rgb(ff8a3d)
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(255, 110, 40, 0.6)
    position = -110, 100
    halign = right
    valign = bottom
}
