# wayland-desktop style: Photographer - mako notifications
font=Noto Serif 11
background-color=#1b1a18f0
text-color=#ece8e1
border-color=#d9a441
progress-color=over #d9a44155
border-size=1
border-radius=10
padding=14,18
margin=10
outer-margin=6,4,0,0
width=380
max-visible=4
default-timeout=4500
icons=1
max-icon-size=40
format=<b>%s</b>\n%b
anchor=top-right
layer=overlay

[app-name=wd-style]
border-size=3
default-timeout=2500

[urgency=low]
border-color=#34312c

[urgency=high]
border-color=#e07a5f
default-timeout=0

[mode=do-not-disturb]
invisible=1
