<!doctype html>
<!-- wayland-desktop style: Photographer - live wallpaper (wd-wallpaper): the gallery wall drifting slowly, a warm light
     leak, bokeh breathing with the music, film grain and dust, and the frame lines of a viewfinder -->
<html>
<head>
<meta charset="utf-8">
<style>
    html { background: transparent; }
    body { margin: 0; height: 100vh; overflow: hidden; background: #121110; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<canvas id="main"></canvas>
<canvas id="grain"></canvas>
<script src="../../common/wallpaper/wd.js"></script>
<script>
"use strict";

// the small radio of wd.js, fitted into this page (Super+Shift+M or wd-style radio hide: hidden)
wd.radioLook = { layout: "camera", panel: "rgba(12, 10, 8, 0.55)", border: "rgba(236, 232, 225, 0.6)",
    fg: "rgba(236, 232, 225, 0.92)", muted: "rgba(236, 232, 225, 0.6)", accent: "rgba(217, 164, 65, 0.95)",
    onAccent: "#14120f", corner: 4, title: "film radio",
    // locked: under the film strip of the lock
    place: () => ({ x: wd.width / 2, y: wd.lock.on ? wd.height * 0.68 : wd.height - 230, w: 520 }) };

const ctx = wd.canvas("main");
const grain = wd.canvas("grain");
const wall = wd.image("wallpaper.jpg");
const random = wd.rand(250);
const bokeh = Array.from({ length: 26 }, () => ({
    x: random(), y: random(), r: 20 + random() * 70, speed: 0.004 + random() * 0.01, phase: random() * 6.28, band: Math.floor(random() * 24),
}));
const noise = document.createElement("canvas");

// a tile of grain, moved at random every frame
noise.width = 256;
noise.height = 256;
(() => {
    const tile = noise.getContext("2d");
    const pixels = tile.createImageData(256, 256);

    for (let i = 0; i < pixels.data.length; i += 4) {
        const v = Math.floor(random() * 255);

        pixels.data[i] = v;
        pixels.data[i + 1] = v;
        pixels.data[i + 2] = v;
        pixels.data[i + 3] = 255;
    }
    tile.putImageData(pixels, 0, 0);
})();

function drawWall(t) {
    ctx.fillStyle = "#121110";
    ctx.fillRect(0, 0, wd.width, wd.height);
    wd.cover(ctx, wall, 1.03, Math.sin(t * 0.03) * 22, Math.cos(t * 0.025) * 10);
}

function drawLeak(t) {
    const x = wd.width * (0.85 + 0.2 * Math.sin(t * 0.05));
    const y = wd.height * (0.1 + 0.15 * Math.cos(t * 0.04));
    const leak = ctx.createRadialGradient(x, y, 0, x, y, wd.height * (0.9 + wd.mid * 0.3));

    leak.addColorStop(0, `rgba(255, 170, 80, ${0.16 + 0.06 * Math.sin(t * 0.3) + wd.mid * 0.12})`);
    leak.addColorStop(1, "rgba(255, 170, 80, 0)");
    ctx.globalCompositeOperation = "screen";
    ctx.fillStyle = leak;
    ctx.fillRect(0, 0, wd.width, wd.height);
    ctx.globalCompositeOperation = "source-over";
}

function drawBokeh(t, dt) {
    ctx.globalCompositeOperation = "lighter";
    for (const b of bokeh) {
        b.y -= b.speed * dt;
        if (b.y < -0.1) {
            b.y = 1.1;
            b.x = random();
        }
        const radius = b.r * (1 + wd.levels[b.band] * 0.4);
        const x = (b.x + Math.sin(t * 0.1 + b.phase) * 0.02) * wd.width;
        const y = b.y * wd.height;
        const light = ctx.createRadialGradient(x, y, radius * 0.5, x, y, radius);
        const alpha = 0.035 + 0.03 * Math.sin(t * 0.5 + b.phase) + wd.levels[b.band] * 0.07;

        light.addColorStop(0, `rgba(217, 164, 65, ${alpha})`);
        light.addColorStop(0.85, `rgba(217, 164, 65, ${alpha * 1.4})`);
        light.addColorStop(1, "rgba(217, 164, 65, 0)");
        ctx.fillStyle = light;
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalCompositeOperation = "source-over";
}

// viewfinder: corner marks, the exposure line (faster with the music) and the recording dot
function drawViewfinder(t) {
    const m = 46;
    const l = 34;
    const w = wd.width;
    const h = wd.height;

    ctx.strokeStyle = "rgba(236, 232, 225, 0.45)";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (const [x, y, dx, dy] of [[m, m + 30, 1, 1], [w - m, m + 30, -1, 1], [m, h - m, 1, -1], [w - m, h - m, -1, -1]]) {
        ctx.moveTo(x, y + dy * l);
        ctx.lineTo(x, y);
        ctx.lineTo(x + dx * l, y);
    }
    ctx.stroke();
    const exposure = `f/1.8   1/${wd.energy > 0.02 ? 500 : 125}   ISO ${200 + Math.round(wd.energy * 600)}   35mm`;

    ctx.font = '13px "JetBrains Mono", monospace';
    ctx.textAlign = "center";
    ctx.shadowColor = "rgba(0, 0, 0, 0.8)";
    ctx.shadowBlur = 6;
    ctx.fillStyle = "rgba(236, 232, 225, 0.7)";
    ctx.fillText(exposure, w / 2, h - m - 12);
    ctx.fillStyle = `rgba(217, 164, 65, ${wd.energy > 0.02 ? 0.6 + 0.4 * Math.sin(t * 4) : 0.4})`;
    ctx.fillText(`\u25cf ${wd.energy > 0.02 ? "REC" : "STBY"}   ${new Date().toLocaleDateString("en-GB")}`, w / 2, h - m - 32);
    ctx.shadowBlur = 0;
    ctx.textAlign = "start";
}

function drawGrain(t) {
    grain.clearRect(0, 0, wd.width, wd.height);
    grain.globalAlpha = 0.07;
    grain.fillStyle = grain.createPattern(noise, "repeat");
    grain.save();
    grain.translate(-Math.floor(random() * 256), -Math.floor(random() * 256));
    grain.fillRect(0, 0, wd.width + 256, wd.height + 256);
    grain.restore();
    grain.globalAlpha = 1;
    // dust and, now and then, a scratch
    grain.fillStyle = "rgba(236, 232, 225, 0.5)";
    for (let i = 0; i < 6; i++) {
        grain.fillRect(random() * wd.width, random() * wd.height, 1 + random() * 2, 1 + random() * 2);
    }
    if (random() < 0.03) {
        grain.fillStyle = "rgba(236, 232, 225, 0.12)";
        grain.fillRect(random() * wd.width, 0, 1, wd.height);
    }
    const vignette = grain.createRadialGradient(wd.width / 2, wd.height / 2, wd.height * 0.35,
        wd.width / 2, wd.height / 2, wd.height * 1.0);
    vignette.addColorStop(0, "rgba(0, 0, 0, 0)");
    vignette.addColorStop(1, `rgba(0, 0, 0, ${0.5 + 0.05 * Math.sin(t * 0.4)})`);
    grain.fillStyle = vignette;
    grain.fillRect(0, 0, wd.width, wd.height);
}

// =========================
// Lock: the screen of a camera over the live wall - grid of thirds, REC and its timecode, the battery, the AF corners
// around the clock, the password as frames on a strip of film, the exposure meter following the music, a live
// histogram, the date printed on the film, the shutter at the unlock
// =========================
const CREAM = "236, 232, 225";
const AMBER = "217, 164, 65";
let shutter = -1;

function bracket(g, x, y, w, h, size) {
    g.beginPath();
    for (const [cx, cy, dx, dy] of [[x, y, 1, 1], [x + w, y, -1, 1], [x, y + h, 1, -1], [x + w, y + h, -1, -1]]) {
        g.moveTo(cx, cy + dy * size);
        g.lineTo(cx, cy);
        g.lineTo(cx + dx * size, cy);
    }
    g.stroke();
}

wd.lockResult = ok => {
    if (ok) {
        shutter = performance.now();
    }
};

wd.lockDraw = (g, t, lock) => {
    const w = wd.width;
    const h = wd.height;
    const m = 46;
    const now = new Date();
    const failed = lock.failedAt > 0 && performance.now() - lock.failedAt < 2500;
    const mono = size => `${size}px "JetBrains Mono", monospace`;
    const serif = (size, style = "") => `${style} ${size}px "Noto Serif", serif`;

    // a little darker at the edges, the grid of thirds, the corners of the frame
    const veil = g.createRadialGradient(w / 2, h / 2, h * 0.25, w / 2, h / 2, h);

    veil.addColorStop(0, "rgba(10, 9, 8, 0.15)");
    veil.addColorStop(1, "rgba(10, 9, 8, 0.6)");
    g.fillStyle = veil;
    g.fillRect(0, 0, w, h);
    g.strokeStyle = `rgba(${CREAM}, 0.16)`;
    g.lineWidth = 1;
    g.beginPath();
    for (const k of [1 / 3, 2 / 3]) {
        g.moveTo(w * k, m);
        g.lineTo(w * k, h - m);
        g.moveTo(m, h * k);
        g.lineTo(w - m, h * k);
    }
    g.stroke();
    g.strokeStyle = `rgba(${CREAM}, 0.85)`;
    g.lineWidth = 2;
    bracket(g, m, m, w - 2 * m, h - 2 * m, 40);

    // the top line: REC and its timecode, the mode, the battery
    const run = Math.floor((performance.now() - (lock.lockedAt || (lock.lockedAt = performance.now()))) / 1000);
    const code = [Math.floor(run / 3600), Math.floor(run / 60) % 60, run % 60].map(n => String(n).padStart(2, "0")).join(":");

    g.textAlign = "start";
    g.font = mono(15);
    g.fillStyle = `rgba(224, 122, 95, ${Math.floor(t * 2) % 2 ? 1 : 0.25})`;
    g.fillText("\u25cf", m + 26, m + 38);
    g.fillStyle = `rgb(${CREAM})`;
    g.fillText(`REC  ${code}`, m + 48, m + 38);
    g.textAlign = "center";
    g.fillText("M   \u00b7   4K 24p   \u00b7   RAW+JPEG   \u00b7   AF-S", w / 2, m + 38);
    const battery = ((lock.info.facts || {}).Battery || [])[0];

    if (battery) {
        const bx = w - m - 128;
        const by = m + 24;
        const level = battery.capacity / 100;

        g.strokeStyle = `rgb(${CREAM})`;
        g.lineWidth = 1.5;
        g.strokeRect(bx, by, 40, 18);
        g.fillStyle = `rgb(${CREAM})`;
        g.fillRect(bx + 40, by + 5, 3, 8);
        g.fillStyle = level < 0.2 ? "rgb(224, 122, 95)" : `rgb(${CREAM})`;
        g.fillRect(bx + 3, by + 3, 34 * level, 12);
        g.textAlign = "start";
        g.fillText(`${Math.round(battery.capacity)}%`, bx + 52, m + 38);
    }

    // the clock in the AF corners: amber while it waits, green once a password is in
    const cy = h * 0.42;
    const focus = lock.typed.length ? "rgb(126, 211, 150)" : `rgb(${AMBER})`;

    g.textAlign = "center";
    g.font = serif(Math.round(h * 0.14));
    wd.glowText(g, now.toTimeString().slice(0, 5), w / 2, cy, "#000000", 6);
    g.fillStyle = `rgb(${CREAM})`;
    g.fillText(now.toTimeString().slice(0, 5), w / 2, cy);
    const day = now.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" });

    g.font = serif(Math.round(h * 0.022), "italic");
    wd.glowText(g, day, w / 2, cy + h * 0.05, "#000000", 3);
    g.fillStyle = `rgb(${AMBER})`;
    g.fillText(day, w / 2, cy + h * 0.05);
    g.strokeStyle = focus;
    g.lineWidth = 2;
    bracket(g, w / 2 - h * 0.26, cy - h * 0.15, h * 0.52, h * 0.22, 26);
    g.fillStyle = focus;
    g.font = mono(11);
    g.fillText(lock.typed.length ? "\u25cf AF  LOCKED" : "AF", w / 2 - h * 0.26 + 40, cy - h * 0.15 - 8);

    // the password: frames on a strip of film, its holes running
    const sw = Math.min(w * 0.5, 620);
    const sh = 74;
    const sx = w / 2 - sw / 2 + lock.shake();
    const sy = h * 0.58;

    g.fillStyle = "rgba(20, 17, 14, 0.92)";
    g.fillRect(sx, sy, sw, sh);
    g.fillStyle = "rgba(236, 232, 225, 0.75)";
    const shift = (t * 30) % 22;

    for (let x = sx + 8 - shift; x < sx + sw - 10; x += 22) {
        if (x > sx + 2) {
            g.fillRect(x, sy + 6, 10, 7);
            g.fillRect(x, sy + sh - 13, 10, 7);
        }
    }
    const count = lock.typed.length;

    if (count) {
        const step = Math.min(46, (sw - 30) / count);

        for (let i = 0; i < count; i++) {
            const x = w / 2 + lock.shake() + (i - (count - 1) / 2) * step - 18;
            const light = g.createLinearGradient(x, sy + 18, x + 36, sy + sh - 18);

            light.addColorStop(0, "rgba(255, 196, 120, 0.95)");
            light.addColorStop(1, "rgba(217, 120, 65, 0.85)");
            g.fillStyle = light;
            g.beginPath();
            g.roundRect(x, sy + 19, 36, sh - 38, 3);
            g.fill();
        }
    } else {
        g.fillStyle = failed ? "rgb(224, 122, 95)" : `rgba(${CREAM}, 0.6)`;
        g.font = serif(17, "italic");
        g.fillText(lock.busy ? "developing\u2026" : (failed ? "out of focus \u2014 try again" : "type to expose"),
            w / 2 + lock.shake(), sy + sh / 2 + 6);
    }

    // the exposure line, its meter following the music
    const ly = h - m - 74;
    const meter = Math.max(-3, Math.min(3, (wd.energy - 0.12) * 18));

    g.fillStyle = `rgb(${CREAM})`;
    g.font = mono(14);
    g.fillText(`1/${wd.energy > 0.02 ? 500 : 125}    F1.8    ISO ${200 + Math.round(wd.energy * 600)}    35mm`, w / 2, ly);
    g.font = mono(11);
    g.fillText("-3 \u00b7 \u00b7 2 \u00b7 \u00b7 1 \u00b7 \u00b7 0 \u00b7 \u00b7 1 \u00b7 \u00b7 2 \u00b7 \u00b7 3+", w / 2, ly + 30);
    g.fillStyle = `rgb(${AMBER})`;
    g.beginPath();
    g.moveTo(w / 2 + meter * 46, ly + 36);
    g.lineTo(w / 2 + meter * 46 - 5, ly + 46);
    g.lineTo(w / 2 + meter * 46 + 5, ly + 46);
    g.fill();

    // the histogram of the music, bottom left; the date printed on the film, bottom right
    const hx = m + 30;
    const hy = h - m - 30;

    g.fillStyle = "rgba(10, 9, 8, 0.55)";
    g.fillRect(hx, hy - 80, 200, 80);
    g.fillStyle = `rgba(${CREAM}, 0.75)`;
    for (let i = 0; i < 48; i++) {
        const bar = Math.max(1, (wd.levels[i] * 0.9 + 0.05 * Math.sin(t + i)) * 76);

        g.fillRect(hx + 4 + i * 4, hy - bar, 3, bar);
    }
    const stamp = `'${String(now.getFullYear()).slice(2)}  ${now.getMonth() + 1}  ${now.getDate()}`;

    g.font = mono(26);
    g.textAlign = "end";
    wd.glowText(g, stamp, w - m - 34, h - m - 34, "rgb(255, 110, 40)", 4);
    g.fillStyle = "#ff8a3d";
    g.fillText(stamp, w - m - 34, h - m - 34);
    if (wd.radio.playing && wd.radio.title) {
        g.textAlign = "center";
        g.fillStyle = `rgb(${AMBER})`;
        g.font = serif(15, "italic");
        g.fillText(`\u266a  ${wd.radio.title}`, w / 2, ly - 34);
    }
    // the shutter at the unlock
    if (shutter > 0) {
        const k = (performance.now() - shutter) / 450;

        if (k < 1) {
            g.fillStyle = `rgba(255, 255, 255, ${0.9 * (1 - k)})`;
            g.fillRect(0, 0, w, h);
        }
    }
    g.textAlign = "start";
};

wd.run((t, dt) => {
    drawWall(t);
    drawLeak(t);
    drawBokeh(t, dt);
    // the lock has its own viewfinder
    if (!wd.lock.on) {
        drawViewfinder(t);
    }
    drawGrain(t);
}, 24);
</script>
</body>
</html>
