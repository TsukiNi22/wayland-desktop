# wayland-desktop: kitty (the colors are in theme.conf, a link to the active style switched by wd-style)

font_family JetBrains Mono
font_size 11.5
window_padding_width 12
hide_window_decorations yes
confirm_os_window_close 0
enable_audio_bell no

# the cursor leaves a short trail when it jumps, and breathes instead of blinking
cursor_shape beam
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_blink_interval 0.6 ease-in-out

tab_bar_edge top
tab_bar_style powerline
tab_powerline_style round

include theme.conf
